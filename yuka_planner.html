<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yuka's Planner</title>
<link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Yuka's Planner&quot;,&quot;short_name&quot;:&quot;Planner&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%23F7F4EF&quot;,&quot;theme_color&quot;:&quot;%232D6A8F&quot;}">
<style>
:root{--bg:#F7F4EF;--surface:#FFFFFF;--border:#E8E2D9;--text:#1A2030;--sub:#6B7280;--muted:#9CA3AF;--accent:#2D6A8F;--r:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto}
.app{padding:0 0 80px}
header{padding:20px 16px 8px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:24px;height:24px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.header-text h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.header-text p{font-size:11px;color:var(--sub);margin-top:1px;font-style:italic}
.save-indicator{margin-left:auto;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;transition:opacity 0.3s}
.save-dot{width:6px;height:6px;border-radius:50%;background:#10B981}
.nav{display:flex;background:var(--surface);border-top:1px solid var(--border);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 4px 12px;background:none;border:none;font-size:10px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s}
.nav button.active{color:var(--accent)}
.nav-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.view{display:none;padding:0 16px}
.view.active{display:block}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.sec{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
.day-nav{display:flex;align-items:center;gap:10px;padding:10px 0}
.day-nav button{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.day-title{flex:1;font-size:16px;font-weight:700}
.day-sub{font-size:12px;color:var(--sub);font-weight:400}
.tl-row{display:grid;grid-template-columns:42px 1fr}
.t-time{font-size:10px;color:var(--muted);text-align:right;padding:10px 8px 0 0}
.t-col{border-left:1px solid var(--border);padding:5px 0 5px 8px;min-height:46px}
.t-col.hb{border-top:1px solid var(--border)}
.ev{border-radius:0;padding:5px 8px;margin-bottom:3px;font-size:12px;font-weight:500;border-left:3px solid;line-height:1.3}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.hrow:last-child{border-bottom:none}
.hicon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hinfo{flex:1}
.hname{font-size:14px;font-weight:500}
.hstreak{font-size:11px;color:var(--sub);margin-top:1px}
.hcheck{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.hcheck svg{width:13px;height:13px;stroke:white;stroke-width:2.8;fill:none;opacity:0;transition:opacity .15s}
.hcheck.done svg{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:12px;text-align:center}
.sn{font-size:24px;font-weight:700}
.sl{font-size:11px;color:var(--sub);margin-top:2px}
.wg-wrap{overflow-x:auto}
.wg-table{width:100%;border-collapse:collapse;min-width:300px}
.wg-table th{font-size:11px;color:var(--sub);font-weight:500;padding:8px 3px;text-align:center;border-bottom:1px solid var(--border);background:var(--surface);white-space:nowrap}
.wg-table th.tc{color:var(--accent)}
.wg-table td{padding:2px 2px;border-bottom:1px solid #F3F0EB;vertical-align:top;height:34px}
.wg-table td:first-child{font-size:10px;color:var(--muted);text-align:right;padding-right:5px;background:var(--bg);width:34px}
.wg-ev{font-size:9px;padding:2px 3px;border-left:2px solid;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-nav{display:flex;align-items:center;gap:10px;padding:10px 0}
.cal-nav button{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-title{flex:1;font-size:16px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hdr{text-align:center;font-size:11px;color:var(--sub);font-weight:500;padding:5px 0}
.cal-cell{background:var(--surface);border-radius:6px;padding:5px 3px;min-height:50px;border:1px solid transparent}
.cal-cell.om{opacity:.35;background:transparent}
.cal-cell.td{border-color:var(--accent)}
.cal-date{font-size:12px;font-weight:500;text-align:center;margin-bottom:3px}
.cal-cell.td .cal-date{color:var(--accent);font-weight:700}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.cal-dot{width:5px;height:5px;border-radius:50%}
.set-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.sinfo{flex:1;min-width:0}
.sname input{font-size:13px;border:none;background:transparent;width:100%;outline:none;color:var(--text)}
.ssub{font-size:11px;color:var(--sub)}
.cpick{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;overflow:hidden}
.delbtn{width:26px;height:26px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:13px;color:#DC2626;flex-shrink:0}
.add-form{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:6px}
.add-form input{padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:var(--bg);outline:none}
.add-form input:focus{border-color:var(--accent)}
.emoji-inp{width:38px;text-align:center;flex-shrink:0}
.name-inp{flex:1}
.add-btn{padding:8px 14px;border-radius:8px;background:var(--accent);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A2030;color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="header-text">
      <h1>Yuka's Planner</h1>
      <p>Make my dreams come true today.</p>
    </div>
    <div class="save-indicator" id="save-ind" style="opacity:0">
      <div class="save-dot"></div>
      <span>保存済み</span>
    </div>
  </header>

  <div id="view-today" class="view active"></div>
  <div id="view-habits" class="view"></div>
  <div id="view-week" class="view"></div>
  <div id="view-month" class="view"></div>
  <div id="view-settings" class="view"></div>

  <nav class="nav">
    <button class="active" onclick="switchTab('today')">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div>
      今日
    </button>
    <button onclick="switchTab('habits')">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
      習慣
    </button>
    <button onclick="switchTab('week')">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      週間
    </button>
    <button onclick="switchTab('month')">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="10" x2="9" y2="21"/></svg></div>
      月間
    </button>
    <button onclick="switchTab('settings')">
      <div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
      設定
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
const DJ=['日','月','火','水','木','金','土'];
const MJ=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DFJ=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];

let habits=JSON.parse(localStorage.getItem('yp_habits')||'null')||[
  {id:'yoga',name:'朝ヨガ 45分',icon:'🧘',color:'#5A8A6A'},
  {id:'med_am',name:'朝瞑想 30分',icon:'🌙',color:'#2D6A8F'},
  {id:'english',name:'英語勉強 1時間',icon:'📖',color:'#E8856A'},
  {id:'study',name:'哲学文献読み',icon:'📚',color:'#3A5FA0'},
  {id:'med_pm',name:'夜瞑想 30分',icon:'✨',color:'#7A4FA0'},
  {id:'journal',name:'日記',icon:'✏️',color:'#888'},
];

let schedule=JSON.parse(localStorage.getItem('yp_schedule')||'null')||[
  {start:7,end:7.75,label:'朝ヨガ 45分',color:'#5A8A6A',bg:'#E8F4EC',days:[0,1,2,3,4,5,6]},
  {start:7.75,end:8.25,label:'朝瞑想 30分',color:'#2D6A8F',bg:'#EBF3F8',days:[0,1,2,3,4,5,6]},
  {start:8.25,end:9,label:'朝食・準備',color:'#C4882A',bg:'#FFF8F0',days:[0,1,2,3,4,5,6]},
  {start:9,end:10,label:'英語勉強',color:'#E8856A',bg:'#FFF3ED',days:[0,1,2,3,4,5,6]},
  {start:10,end:13,label:'GA仕事',color:'#9B6AD4',bg:'#F5F0FF',days:[1,2,3,4,5]},
  {start:13.5,end:16,label:'PHIL 725',color:'#1A2E3A',bg:'#EEF2F5',days:[4]},
  {start:15,end:17.5,label:'PHIL 414B',color:'#1A2E3A',bg:'#EEF2F5',days:[2]},
  {start:15.5,end:18,label:'PHIL 770',color:'#1A2E3A',bg:'#EEF2F5',days:[3]},
  {start:18,end:21,label:'哲学文献・課題',color:'#3A5FA0',bg:'#F0F4FF',days:[0,1,2,3,4,5,6]},
  {start:21,end:21.5,label:'夜瞑想 30分',color:'#7A4FA0',bg:'#F0EBF8',days:[0,1,2,3,4,5,6]},
  {start:21.5,end:22.5,label:'シャワー・日記',color:'#888',bg:'#FAFAFA',days:[0,1,2,3,4,5,6]},
];

let data=JSON.parse(localStorage.getItem('yp_data')||'{}');
let dayOffset=0,monthOffset=0,tab='today';
let saveTimer=null;

function autoSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem('yp_habits',JSON.stringify(habits));
    localStorage.setItem('yp_schedule',JSON.stringify(schedule));
    localStorage.setItem('yp_data',JSON.stringify(data));
    const ind=document.getElementById('save-ind');
    ind.style.opacity='1';
    setTimeout(()=>ind.style.opacity='0',2000);
  },500);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function dateKey(d){return d.toISOString().slice(0,10)}
function getDate(o){const d=new Date();d.setDate(d.getDate()+o);return d}
function getWeekDates(){
  const n=new Date(),dow=n.getDay(),m=new Date(n);
  m.setDate(n.getDate()-(dow===0?6:dow-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});
}
function getStreak(hid){
  let s=0;const n=new Date();
  for(let i=0;i<365;i++){const d=new Date(n);d.setDate(n.getDate()-i);const k=dateKey(d);if(data[k]&&data[k][hid])s++;else if(i>0)break;}
  return s;
}

function switchTab(t){
  tab=t;
  document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['today','habits','week','month','settings'][i]===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+t).classList.add('active');
  render();
}

function toggleHabit(hid,dk){
  if(!data[dk])data[dk]={};
  data[dk][hid]=!data[dk][hid];
  autoSave();
  showToast(data[dk][hid]?'✅ チェック完了！':'チェックを外しました');
  render();
}

function render(){
  if(tab==='today')renderToday();
  else if(tab==='habits')renderHabits();
  else if(tab==='week')renderWeek();
  else if(tab==='month')renderMonth();
  else renderSettings();
}

function renderToday(){
  const d=getDate(dayOffset),dow=d.getDay(),key=dateKey(d),today=dateKey(new Date()),isT=key===today;
  let h=`<div class="day-nav">
    <button onclick="changeDay(-1)">‹</button>
    <div class="day-title">${isT?'今日':DFJ[dow]}<span class="day-sub"> — ${d.getMonth()+1}月${d.getDate()}日</span></div>
    <button onclick="changeDay(1)">›</button>
  </div><div class="sec">スケジュール</div><div class="card">`;
  for(let hr=6;hr<=22;hr++){
    const evs=schedule.filter(e=>Math.floor(e.start)===hr&&e.days.includes(dow));
    const evs2=schedule.filter(e=>e.start===hr+0.5&&e.days.includes(dow));
    h+=`<div class="tl-row"><div class="t-time">${hr}:00</div><div class="t-col${hr>6?' hb':''}">`;
    evs.forEach(e=>h+=`<div class="ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color}">${e.label}</div>`);
    evs2.forEach(e=>h+=`<div class="ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color};margin-top:4px">${e.label}</div>`);
    h+='</div></div>';
  }
  h+=`</div><div class="sec">今日の習慣</div><div class="card">`;
  habits.forEach(hb=>{
    const done=!!(data[key]&&data[key][hb.id]),streak=getStreak(hb.id);
    h+=`<div class="hrow">
      <div class="hicon" style="background:${hb.color}22">${hb.icon}</div>
      <div class="hinfo"><div class="hname">${hb.name}</div><div class="hstreak">${streak>0?`🔥 ${streak}日連続`:'今日からスタート'}</div></div>
      <button class="hcheck${done?' done':''}" style="${done?`background:${hb.color};border-color:${hb.color}`:''}" onclick="toggleHabit('${hb.id}','${key}')" aria-label="${hb.name}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>`;
  });
  h+='</div>';
  document.getElementById('view-today').innerHTML=h;
}

function renderHabits(){
  const dates=getWeekDates(),today=dateKey(new Date());
  let total=0,possible=dates.length*habits.length;
  dates.forEach(d=>{const k=dateKey(d);habits.forEach(h=>{if(data[k]&&data[k][h.id])total++;})});
  const pct=possible>0?Math.round(total/possible*100):0;
  const maxS=Math.max(0,...habits.map(h=>getStreak(h.id)));
  let h=`<div style="padding-top:8px"></div><div class="stats">
    <div class="stat"><div class="sn">${pct}%</div><div class="sl">今週の達成率</div></div>
    <div class="stat"><div class="sn">${total}</div><div class="sl">今週のチェック</div></div>
    <div class="stat"><div class="sn">${maxS}日</div><div class="sl">最長連続</div></div>
  </div><div class="sec">今週の習慣</div><div class="card"><div class="wg-wrap">
  <table class="wg-table"><thead><tr><th></th>`;
  dates.forEach(d=>{const k=dateKey(d),isT=k===today;h+=`<th class="${isT?'tc':''}">${DJ[d.getDay()]}<br>${d.getDate()}</th>`;});
  h+='</tr></thead><tbody>';
  habits.forEach(hb=>{
    h+=`<tr><td style="text-align:left;padding:10px 10px;font-size:12px;border-bottom:1px solid #F3F0EB"><span>${hb.icon}</span> ${hb.name}</td>`;
    dates.forEach(d=>{
      const k=dateKey(d),done=!!(data[k]&&data[k][hb.id]);
      h+=`<td style="text-align:center;border-bottom:1px solid #F3F0EB">
        <button class="hcheck${done?' done':''}" style="${done?`background:${hb.color};border-color:${hb.color}`:''}" onclick="toggleHabit('${hb.id}','${k}')" aria-label="${hb.name}">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button></td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('view-habits').innerHTML=h;
}

function renderWeek(){
  const dates=getWeekDates(),today=dateKey(new Date());
  let h='<div style="padding-top:8px"></div><div class="card"><div class="wg-wrap"><table class="wg-table"><thead><tr><th></th>';
  dates.forEach(d=>{const k=dateKey(d),isT=k===today;h+=`<th class="${isT?'tc':''}">${DJ[d.getDay()]}<br>${d.getDate()}</th>`;});
  h+='</tr></thead><tbody>';
  for(let hr=7;hr<=22;hr++){
    h+=`<tr><td>${hr}</td>`;
    dates.forEach(d=>{
      const dow=d.getDay(),evs=schedule.filter(e=>Math.floor(e.start)===hr&&e.days.includes(dow));
      h+='<td>';
      evs.forEach(e=>h+=`<div class="wg-ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color}">${e.label}</div>`);
      h+='</td>';
    });
    h+='</tr>';
  }
  h+='</tbody></table></div></div>';
  document.getElementById('view-week').innerHTML=h;
}

function renderMonth(){
  const n=new Date(),yr=n.getFullYear(),mo=n.getMonth()+monthOffset;
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0),today=dateKey(new Date());
  let h=`<div class="cal-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="cal-title">${yr}年 ${MJ[((mo%12)+12)%12]}</div>
    <button onclick="changeMonth(1)">›</button>
  </div><div class="cal-grid">`;
  DJ.forEach(d=>h+=`<div class="cal-hdr">${d}</div>`);
  const startDow=first.getDay();
  for(let i=0;i<startDow;i++){const d=new Date(first);d.setDate(d.getDate()-(startDow-i));h+=`<div class="cal-cell om"><div class="cal-date">${d.getDate()}</div></div>`;}
  for(let day=1;day<=last.getDate();day++){
    const d=new Date(yr,mo<0?mo+12:mo,day),k=dateKey(d),isT=k===today;
    const done=habits.filter(hb=>(data[k]||{})[hb.id]);
    h+=`<div class="cal-cell${isT?' td':''}"><div class="cal-date">${day}</div><div class="cal-dots">`;
    done.slice(0,6).forEach(hb=>h+=`<div class="cal-dot" style="background:${hb.color}"></div>`);
    h+='</div></div>';
  }
  const rem=(7-((startDow+last.getDate())%7))%7;
  for(let i=1;i<=rem;i++)h+=`<div class="cal-cell om"><div class="cal-date">${i}</div></div>`;
  h+='</div>';
  document.getElementById('view-month').innerHTML=h;
}

function renderSettings(){
  let h='<div style="padding-top:8px"></div><div class="sec">習慣をカスタマイズ</div><div class="card">';
  habits.forEach((hb,i)=>{
    h+=`<div class="set-row">
      <div class="hicon" style="background:${hb.color}22">${hb.icon}</div>
      <div class="sinfo">
        <div class="sname"><input value="${hb.name}" onchange="updateName(${i},this.value)" placeholder="習慣名"></div>
        <div class="ssub">アイコン: <input value="${hb.icon}" onchange="updateIcon(${i},this.value)" style="width:30px;border:none;background:transparent;font-size:13px;outline:none"></div>
      </div>
      <input type="color" class="cpick" value="${hb.color}" oninput="updateColor(${i},this.value)" title="色を変更" style="background:${hb.color}">
      <button class="delbtn" onclick="deleteHabit(${i})" aria-label="削除">×</button>
    </div>`;
  });
  h+=`<div class="add-form">
    <input id="ni" class="emoji-inp" placeholder="🌟" maxlength="2">
    <input id="nn" class="name-inp" placeholder="新しい習慣を追加">
    <button class="add-btn" onclick="addHabit()">追加</button>
  </div></div>`;
  document.getElementById('view-settings').innerHTML=h;
}

function updateName(i,v){habits[i].name=v;autoSave()}
function updateIcon(i,v){habits[i].icon=v;autoSave();render()}
function updateColor(i,v){habits[i].color=v;autoSave();render()}
function deleteHabit(i){if(confirm('削除しますか？')){habits.splice(i,1);autoSave();render()}}
function addHabit(){
  const icon=document.getElementById('ni').value.trim()||'⭐';
  const name=document.getElementById('nn').value.trim();
  if(!name)return;
  habits.push({id:'h_'+Date.now(),name,icon,color:'#888'});
  autoSave();showToast('習慣を追加しました！');render();
}
function changeDay(d){dayOffset+=d;render()}
function changeMonth(d){monthOffset+=d;render()}

render();
</script>
</body>
</html>
