<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yuka's Planner</title>
<style>
:root{--bg:#F7F4EF;--sur:#FFF;--bd:#E8E2D9;--tx:#1A2030;--sub:#6B7280;--mu:#9CA3AF;--ac:#2D6A8F;--r:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:0 auto}
.app{padding:0 0 80px}
header{padding:18px 16px 8px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:22px;height:22px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ht h1{font-size:17px;font-weight:700}
.ht p{font-size:11px;color:var(--sub);font-style:italic}
.si{margin-left:auto;font-size:10px;color:var(--mu);display:flex;align-items:center;gap:4px;transition:opacity .3s}
.sd{width:6px;height:6px;border-radius:50%;background:#10B981}
.nav{display:flex;background:var(--sur);border-top:1px solid var(--bd);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 4px 12px;background:none;border:none;font-size:10px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nav button.active{color:var(--ac)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.view{display:none;padding:0 16px}
.view.active{display:block}
.card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:12px;overflow:hidden}
.sec{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between}
.sec-edit{font-size:11px;color:var(--ac);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.dnav{display:flex;align-items:center;gap:10px;padding:10px 0}
.dnav button{width:32px;height:32px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dtitle{flex:1;font-size:16px;font-weight:700}
.dsub{font-size:12px;color:var(--sub);font-weight:400}
.tlr{display:grid;grid-template-columns:42px 1fr}
.tt{font-size:10px;color:var(--mu);text-align:right;padding:10px 8px 0 0}
.tc{border-left:1px solid var(--bd);padding:5px 0 5px 8px;min-height:46px}
.tc.hb{border-top:1px solid var(--bd)}
.ev{padding:5px 8px;margin-bottom:3px;font-size:12px;font-weight:500;border-left:3px solid;line-height:1.3}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.hrow:last-child{border-bottom:none}
.hic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hin{flex:1}
.hn{font-size:14px;font-weight:500}
.hs{font-size:11px;color:var(--sub);margin-top:1px}
.hck{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.hck svg{width:13px;height:13px;stroke:white;stroke-width:2.8;fill:none;opacity:0;transition:opacity .15s}
.hck.done svg{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:12px;text-align:center}
.sn{font-size:24px;font-weight:700}
.sl{font-size:11px;color:var(--sub);margin-top:2px}
.wgw{overflow-x:auto}
.wgt{width:100%;border-collapse:collapse;min-width:300px;table-layout:fixed}
.wgt th{font-size:11px;color:var(--sub);font-weight:500;padding:8px 3px;text-align:center;border-bottom:1px solid var(--bd);background:var(--sur);white-space:nowrap}
.wgt th.tc2{color:var(--ac)}
.wgt td{padding:2px;border-bottom:1px solid #F3F0EB;vertical-align:top;height:34px}
.wgt td:first-child{font-size:10px;color:var(--mu);text-align:right;padding-right:5px;background:var(--bg);width:34px}
.wgev{font-size:9px;padding:2px 3px;border-left:2px solid;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnav{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.cnav button{width:36px;height:36px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.cnav button:hover{background:var(--bg)}
.ctitle{flex:1;font-size:20px;font-weight:700;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.chdr{text-align:center;font-size:11px;color:var(--sub);font-weight:500;padding:5px 0}
.ccell{background:var(--sur);border-radius:6px;padding:4px 3px;min-height:56px;border:1px solid transparent;cursor:pointer;transition:border-color .15s}
.ccell:active{border-color:var(--ac)}
.ccell.om{opacity:.3;background:transparent;cursor:default}
.ccell.td{border-color:var(--ac)}
.ccell.sel{border-color:var(--ac);background:#EBF3F8}
.cdt{font-size:12px;font-weight:500;text-align:center;margin-bottom:2px}
.ccell.td .cdt{color:var(--ac);font-weight:700}
.cdots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.cdot{width:5px;height:5px;border-radius:50%}
.ctc{font-size:9px;color:var(--sub);text-align:center;margin-top:1px}
.set-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.set-row:last-child{border-bottom:none}
.sri{flex:1;min-width:0}
.sri input{font-size:13px;border:none;background:transparent;width:100%;outline:none;color:var(--tx)}
.srs{font-size:11px;color:var(--sub)}
.srs input{border:none;background:transparent;font-size:13px;outline:none;width:28px;display:inline}
.cpick{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;overflow:hidden}
.delbtn{width:26px;height:26px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:13px;color:#DC2626;flex-shrink:0}
.af{padding:12px 14px;border-top:1px solid var(--bd);display:flex;gap:6px}
.af input{padding:8px 10px;border-radius:8px;border:1px solid var(--bd);font-size:13px;background:var(--bg);outline:none;flex:1}
.af input:focus{border-color:var(--ac)}
.eji{width:38px;text-align:center;flex-shrink:0;flex:none}
.abtn{padding:8px 14px;border-radius:8px;background:var(--ac);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A2030;color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
.trow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.trow:last-child{border-bottom:none}
.trow.dt .tlb{text-decoration:line-through;color:var(--mu)}
.tlb{flex:1;font-size:14px}
.tck{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.tck.done{background:#10B981;border-color:#10B981}
.tck svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none;opacity:0}
.tck.done svg{opacity:1}
.tdl{width:22px;height:22px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:12px;color:#DC2626;flex-shrink:0}
.empty{padding:20px;text-align:center;color:var(--mu);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sur);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-size:16px;font-weight:700;margin-bottom:4px}
.modal p{font-size:12px;color:var(--sub);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sch-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sch-edit-row:last-child{border-bottom:none}
.sch-edit-row input[type=text]{flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)}
.sch-edit-row input[type=text]:focus{border-color:var(--ac)}
.memo-box{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg);resize:vertical;min-height:80px;font-family:inherit;line-height:1.5}
.memo-box:focus{border-color:var(--ac)}
.memo-saved{font-size:11px;color:var(--mu);margin-top:4px;transition:opacity .3s}
.mandala-wrap{width:100%;position:relative;margin:12px 0}
.mandala-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:0 auto}
.mandala-center{grid-column:2;grid-row:2;background:linear-gradient(135deg,var(--ac),#7A4FA0);color:white;border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;font-weight:700;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(45,106,143,.3)}
.mandala-cat{background:var(--sur);border:1.5px solid var(--bd);border-radius:12px;padding:6px 4px;text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.mandala-cat:hover{border-color:var(--ac);transform:scale(1.02)}
.mandala-cat.active{border-color:var(--ac)}
.mandala-water{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(45,106,143,.15),rgba(45,106,143,.35));transition:height .5s ease;border-radius:0 0 10px 10px}
.mandala-cat-icon{font-size:18px;position:relative;z-index:1}
.mandala-cat-name{font-size:10px;font-weight:600;color:var(--tx);position:relative;z-index:1;line-height:1.2}
.mandala-cat-pct{font-size:9px;color:var(--ac);font-weight:600;position:relative;z-index:1}
.mandala-sync{font-size:8px;color:var(--mu);position:relative;z-index:1;line-height:1.2}
.mandala-detail{background:var(--sur);border-radius:12px;border:1px solid var(--bd);padding:12px;margin:8px 0}
.mandala-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.mandala-item:last-child{border-bottom:none}
.mandala-item-label{flex:1;font-size:13px}
.mandala-timer-btn{padding:5px 10px;border-radius:8px;background:var(--ac)22;border:1px solid var(--ac);color:var(--ac);font-size:11px;cursor:pointer}
.mandala-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mandala-check.done{background:#10B981;border-color:#10B981}
.mandala-check svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none}
.dream-tree-wrap{width:100%;text-align:center;margin:8px 0;position:relative;overflow:hidden;border-radius:var(--r);background:linear-gradient(180deg,#87CEEB 0%,#98D8C8 60%,#7CBA6E 60%,#5A8A5A 100%);min-height:280px}
.tree-svg{width:100%;max-width:320px;height:280px}
.dream-section{margin-bottom:16px}
.dream-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.dream-item:last-child{border-bottom:none}
.dream-input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:var(--tx);font-family:inherit;resize:none;min-height:20px}
.goal-card{background:var(--sur);border-radius:8px;border:1px solid var(--bd);padding:10px 12px;margin-bottom:6px}
.goal-month{font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px}
.goal-inp{width:100%;border:none;background:transparent;outline:none;font-size:13px;color:var(--tx);font-family:inherit}
.reverse-card{background:linear-gradient(135deg,#EBF3F8,#F5F0FF);border-radius:8px;border:1px solid var(--bd);padding:12px;margin-bottom:8px}
.reverse-arrow{text-align:center;color:var(--mu);font-size:18px;margin:4px 0}
.timer-circle{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--ac) 0deg,var(--bd) 0deg);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;transition:background 0.5s}
.timer-inner{width:110px;height:110px;border-radius:50%;background:var(--sur);display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-time{font-size:24px;font-weight:700;color:var(--tx)}
.timer-label{font-size:11px;color:var(--mu)}
.study-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.study-item:last-child{border-bottom:none}
.study-item.active{background:var(--bg)}
.study-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.study-check.done{background:#10B981;border-color:#10B981}
.study-check svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none;opacity:0}
.study-check.done svg{opacity:1}
.play-btn{padding:10px 28px;border-radius:20px;background:var(--ac);color:white;border:none;font-size:14px;font-weight:600;cursor:pointer}
.stop-btn{padding:10px 28px;border-radius:20px;background:#DC2626;color:white;border:none;font-size:14px;font-weight:600;cursor:pointer}
#timer-overlay{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000}
#timer-overlay.active{display:flex}
#timer-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.7;transition:opacity 1s}
#timer-overlay-content{position:relative;z-index:1;text-align:center;color:white}
.overlay-time{font-size:80px;font-weight:200;letter-spacing:4px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.overlay-label{font-size:16px;opacity:0.8;margin-bottom:40px;letter-spacing:2px}
.overlay-pause{padding:14px 40px;border-radius:30px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:white;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s}
.overlay-pause:hover{background:rgba(255,255,255,0.25)}
.overlay-stop{margin-top:16px;padding:10px 30px;border-radius:30px;background:rgba(220,38,38,0.5);border:1px solid rgba(220,38,38,0.6);color:white;font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}
.overlay-progress{width:200px;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;margin:24px auto}
.overlay-progress-bar{height:100%;background:white;border-radius:2px;transition:width 1s linear}
.sch-edit-row .delbtn{flex-shrink:0}
</style>
</head>
<body>
<div id="timer-overlay">
  <div id="timer-bg"></div>
  <div id="timer-overlay-content">
    <div class="overlay-label" id="overlay-label">集中中</div>
    <div class="overlay-time" id="overlay-time">25:00</div>
    <div class="overlay-progress"><div class="overlay-progress-bar" id="overlay-bar" style="width:100%"></div></div>
    <button class="overlay-pause" id="overlay-pause-btn" onclick="togglePause()">⏸ 一時停止</button>
    <br>
    <button class="overlay-stop" onclick="stopTimerOverlay()">⏹ 終了</button>
  </div>
</div>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="ht">
      <h1>Yuka's Planner</h1>
      <p>Make my dreams come true today.</p>
    </div>
    <div class="si" id="si" style="opacity:0">
      <div class="sd"></div><span>保存済み</span>
    </div>
  </header>

  <div id="view-today" class="view active"></div>
  <div id="view-habits" class="view"></div>
  <div id="view-week" class="view"></div>
  <div id="view-month" class="view"></div>
  <div id="view-settings" class="view"></div>
  <div id="view-dream" class="view"></div>
  <div id="view-memo" class="view"></div>
  <div id="view-study" class="view"></div>

  <nav class="nav">
    <button class="active" onclick="sw('today')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div>今日
    </button>
    <button onclick="sw('habits')">
      <div class="ni"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>習慣
    </button>
    <button onclick="sw('week')">
      <div class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>週間
    </button>
    <button onclick="sw('month')">
      <div class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="10" x2="9" y2="21"/></svg></div>月間
    </button>
    <button onclick="sw('study')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>学習
    </button>
    <button onclick="sw('dream')">
      <div class="ni"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div>夢
    </button>
    <button onclick="sw('memo')">
      <div class="ni"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>メモ
    </button>
    <button onclick="sw('settings')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>設定
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div id="modal-wrap"></div>

<script>
const DJ=['日','月','火','水','木','金','土'];
const MJ=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function applyRecurringTasks(){
  // Generate from Aug 24 2026 to Dec 18 2026 (entire semester)
  const semStart=new Date(2026,7,24); // Aug 24
  const semEnd=new Date(2026,11,18); // Dec 18
  
  // Remove ALL existing recurring task instances
  Object.keys(tasks).forEach(k=>{
    tasks[k]=(tasks[k]||[]).filter(t=>!t.recurringId);
  });

  // Find Monday of semester start week
  const startDow=semStart.getDay();
  const firstMonday=new Date(semStart);
  firstMonday.setDate(semStart.getDate()-(startDow===0?6:startDow-1));
  firstMonday.setHours(0,0,0,0);
  
  // Count weeks in semester
  const msPerWeek=7*24*60*60*1000;
  const totalWeeks=Math.ceil((semEnd-firstMonday)/msPerWeek)+1;
  
  for(let weekOffset=0;weekOffset<totalWeeks;weekOffset++){
    recurringTasks.forEach(rt=>{
      (rt.days||[]).forEach(d=>{
        // JS: 0=Sun,1=Mon...6=Sat
        // Mon-start offset: Mon=0,Tue=1,...,Sun=6
        const dayOffset=d===0?6:d-1;
        const target=new Date(firstMonday);
        target.setDate(firstMonday.getDate()+weekOffset*7+dayOffset);
        const k=dk(target);
        if(!tasks[k])tasks[k]=[];
        if(!tasks[k].some(t=>t.recurringId===rt.id)){
          tasks[k].push({id:'r'+rt.id+'_'+k,label:rt.label,done:false,recurringId:rt.id});
        }
      });
    });
  }
  save();
}

function dk(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function getD(o){const d=new Date();d.setDate(d.getDate()+o);return d}
function getWk(){
  const n=new Date(),dow=n.getDay(),m=new Date(n);
  m.setDate(n.getDate()-(dow===0?6:dow-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});
}
function streak(hid){
  let s=0;const n=new Date();
  for(let i=0;i<365;i++){const d=new Date(n);d.setDate(n.getDate()-i);const k=dk(d);if(data[k]&&data[k][hid])s++;else if(i>0)break;}
  return s;
}

function addModalTask(key){
  const inp=document.getElementById('modal-inp');
  if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const startTime=document.getElementById('modal-start')?.value||'';
  const endTime=document.getElementById('modal-end')?.value||'';
  const color=document.getElementById('modal-color')?.value||'';
  if(!tasks[key])tasks[key]=[];
  tasks[key].push({id:'t'+Date.now(),label:v,done:false,startTime,endTime,color:color||undefined});
  inp.value='';
  if(document.getElementById('modal-start'))document.getElementById('modal-start').value='';
  if(document.getElementById('modal-end'))document.getElementById('modal-end').value='';
  save();
  refreshModal(key);
  render();
}

function refreshModal(key){
  const [dy,dm,dd]=key.split('-').map(Number);
  const d=new Date(dy,dm-1,dd);
  const dayTasks=tasks[key]||[];
  let html='';
  if(dayTasks.length===0){
    html='<div class="empty">タスクはまだありません</div>';
  } else {
    [...dayTasks].sort((a,b)=>{
      if(!a.startTime&&!b.startTime)return 0;
      if(!a.startTime)return 1;
      if(!b.startTime)return -1;
      return a.startTime.localeCompare(b.startTime);
    }).forEach(t=>{
      const timeStr=t.startTime?(t.endTime?`${t.startTime}〜${t.endTime} `:`${t.startTime} `):'';
      html+=`<div>
        <div class="trow${t.done?' dt':''}">
          <button class="tck${t.done?' done':''}" onclick="toggleT('${key}','${t.id}');refreshModal('${key}')">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <span class="tlb" onclick="toggleTaskNote('${t.id}')" style="cursor:pointer"><span style="font-size:11px;color:var(--sub)">${timeStr}</span>${t.label}</span>
          <button class="tdl" onclick="delT('${key}','${t.id}');refreshModal('${key}')">×</button>
        </div>
        <div id="tnote-${t.id}" style="display:none;padding:0 12px 8px 44px">
          <textarea style="width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--bd);font-size:12px;outline:none;background:var(--bg);resize:none;min-height:50px;font-family:inherit" placeholder="メモを追加..." oninput="saveTaskNote('${key}','${t.id}',this.value)">${(t.note||'').replace(/</g,'&lt;')}</textarea>
        </div>
      </div>`;
    });
  }
  const el=document.getElementById('modal-tasks');
  if(el)el.innerHTML=html;
}

function openTimeSlot(key,t){
  // Pre-fill time and open day modal
  openDayModal(key);
  // Set the time fields after modal opens
  setTimeout(()=>{
    const startEl=document.getElementById('modal-start');
    const endEl=document.getElementById('modal-end');
    if(startEl){
      const hr=Math.floor(t);
      const min=t%1===0.5?'30':'00';
      startEl.value=`${String(hr).padStart(2,'0')}:${min}`;
    }
    if(endEl){
      const endT=t+0.5;
      const hr=Math.floor(endT);
      const min=endT%1===0.5?'30':'00';
      endEl.value=`${String(hr).padStart(2,'0')}:${min}`;
    }
    // Focus task input
    const inp=document.getElementById('modal-inp');
    if(inp)inp.focus();
  },100);
}

      </div>
      <div class="sec" style="margin-top:0">${p.title}</div>

      document.getElementById('view-memo').innerHTML=html;
      return;
    }

    const html=`<div style="padding-top:8px"></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <button onclick="memoOpenIndex=null;renderMemo()" style="padding:6px 12px;border-radius:8px;background:var(--sur);border:1px solid var(--bd);font-size:13px;cursor:pointer">← 戻る</button>
      <button onclick="deleteMemoPage(${i})" style="margin-left:auto;padding:6px 12px;border-radius:8px;background:#FEE2E2;border:none;font-size:13px;color:#DC2626;cursor:pointer">削除</button>
    </div>
    <div class="card">
      <div style="padding:12px 14px;border-bottom:1px solid var(--bd)">
        <input value="${p.title.replace(/"/g,'&quot;')}" onchange="updateMemoTitle(${i},this.value)" style="width:100%;font-size:18px;font-weight:700;border:none;background:transparent;outline:none;color:var(--tx)">

    document.getElementById('view-memo').innerHTML=html;
    return;
  }

  // ページ一覧表示
  let html=`<div style="padding-top:8px"></div>

    <button class="abtn" onclick="addMemoPage()" style="font-size:12px;padding:6px 12px">＋ ページ追加</button>
  </div>

  pages.forEach((p,i)=>{
    const preview=p.content.replace(/\n/g,' ').slice(0,40)+(p.content.length>40?'…':'');
    html+=`<div draggable="true" 
      ondragstart="memoDragStart(${i})" 
      ondragover="memoDragOver(event,${i})"

function updateMemoTitle(i,val){
  const pages=getMemoPages();
  pages[i].title=val;
  saveMemoPages(pages);
}

function updateMemoContent(i,val){
  const pages=getMemoPages();
  pages[i].content=val;
  saveMemoPages(pages);
}

function addMemoPage(){
  const pages=getMemoPages();
  const newIdx=pages.length;
  pages.push({id:'p'+Date.now(),title:'📝 新しいページ',content:''});
  saveMemoPages(pages);
  memoOpenIndex=newIdx;
  renderMemo();
}

function deleteMemoPage(i){
  if(!confirm('このページを削除しますか？'))return;
  const pages=getMemoPages();
  pages.splice(i,1);
  saveMemoPages(pages);
  memoOpenIndex=null;
  renderMemo();
}

function renderYearlyCalendar(){
  const months=[
    {y:2026,m:7,label:'2026年8月'},{y:2026,m:8,label:'2026年9月'},
    {y:2026,m:9,label:'2026年10月'},{y:2026,m:10,label:'2026年11月'},
    {y:2026,m:11,label:'2026年12月'},{y:2027,m:0,label:'2027年1月'},
    {y:2027,m:1,label:'2027年2月'},{y:2027,m:2,label:'2027年3月'},
    {y:2027,m:3,label:'2027年4月'},{y:2027,m:4,label:'2027年5月'},
  ];
  const DJ2=['日','月','火','水','木','金','土'];
  let html='';
  months.forEach(({y,m,label})=>{
    const first=new Date(y,m,1);
    const last=new Date(y,m+1,0);
    const today=dk(new Date());
    html+=`<div class="card" style="margin-bottom:12px;padding:10px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ac)">${label}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px">`;
    DJ2.forEach(d=>html+=`<div style="text-align:center;color:var(--mu);padding:2px;font-weight:600">${d}</div>`);
    const startDow=first.getDay();
    for(let i=0;i<startDow;i++)html+=`<div></div>`;
    for(let day=1;day<=last.getDate();day++){
      const d=new Date(y,m,day);
      const k=dk(d);
      const isT=k===today;
      const uhEv=UH_CALENDAR[k]||'';
      const hasTasks=(tasks[k]||[]).length>0;
      html+=`<div style="text-align:center;padding:2px 1px;border-radius:4px;${isT?'background:var(--ac);color:white;font-weight:700':''}${uhEv?';background:#EBF3F8;color:#2D6A8F;font-weight:600':''}" title="${uhEv}">
        ${day}${uhEv?'<div style="font-size:7px;line-height:1;overflow:hidden">'+uhEv.slice(0,3)+'</div>':''}
      </div>`;
    }
    html+='</div>';

    // UH events this month
    const monthKey=`${y}-${String(m+1).padStart(2,'0')}`;
    const eventsThisMonth=Object.entries(UH_CALENDAR).filter(([k])=>k.startsWith(monthKey));
    if(eventsThisMonth.length>0){
      html+=`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px">`;
      eventsThisMonth.forEach(([k,v])=>{
        const [ky,km,kd]=k.split('-').map(Number);const d=new Date(ky,km-1,kd);
        html+=`<div style="font-size:11px;color:var(--sub);margin-bottom:2px">${d.getMonth()+1}/${d.getDate()} ${v}</div>`;
      });
      html+='</div>';
    }
    html+='</div>';
  });
  return html;
}

  const key=el.getAttribute('data-key');
  toggleUrgent(key,id);
  // Update checkbox visual
  const cb=el.querySelector('input[type=checkbox]');
  if(cb)cb.checked=!cb.checked;
}

function addUrgentTask(key){

  if(!tasks[key])tasks[key]=[];
  tasks[key].push({id:'u'+Date.now(),label:inp.value.trim(),done:false,urgent:true});

}

function toggleUrgent(key,id){
  const t=(tasks[key]||[]).find(x=>x.id===id);
  if(t){t.urgent=!t.urgent;save();render();}
}

function playPing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.frequency.value=880;o.type='sine';
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.4);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.4);
  }catch(e){}
}

function playTimerEnd(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;o.type='sine';
      g.gain.setValueAtTime(0.3,ctx.currentTime+i*0.2);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.2+0.4);
      o.start(ctx.currentTime+i*0.2);o.stop(ctx.currentTime+i*0.2+0.4);
    });
  }catch(e){}
}

function renderToday(){
  const d=getD(dayOff),dow=d.getDay(),key=dk(d),today=dk(new Date()),isT=key===today;
  const dayTasks=tasks[key]||[];
  const doneT=dayTasks.filter(t=>t.done).length;
  let h=`<div class="dnav">
    <button onclick="dayOff--;render()">‹</button>
    <div class="dtitle">${isT?'今日':DFJ[dow]}<span class="dsub"> — ${d.getMonth()+1}月${d.getDate()}日</span></div>
    <button onclick="dayOff++;render()">›</button>
  </div>
  <div class="sec"><span>⚡ 今やるべきこと</span><span class="sec-edit" onclick="openUrgentEdit('${key}')">編集</span></div>
  <div class="card" style="margin-bottom:8px">`;
  {
    const now=new Date();
    const nowT=now.getHours()+(now.getMinutes()/60);
    // 自動マッチ：時間指定タスク（±1時間以内）+ urgent設定タスク
    const autoTasks=dayTasks.filter(t=>{
      if(t.done)return false;
      if(t.urgent)return true; // 手動設定
      if(t.startTime){
        const st=strToTime(t.startTime);
        return st>=nowT-0.5&&st<=nowT+1.5; // ±1.5時間
      }
      return false;
    });
    // スケジュールから現在時刻に合うイベント
    const nowEvs=schedule.filter(e=>e.days.includes(dow)&&e.start<=nowT+0.5&&e.end>=nowT-0.25);
    
    if(autoTasks.length>0||nowEvs.length>0){
      // スケジュールイベント表示
      nowEvs.forEach(e=>{
        h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);background:${e.bg}">
          <div style="width:4px;height:30px;background:${e.color};border-radius:2px;flex-shrink:0"></div>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600;color:${e.color}">${e.label}</div>
            <div style="font-size:10px;color:var(--mu)">${timeToStr(e.start)}〜${timeToStr(e.end)}</div>
          </div>
          <div style="font-size:10px;padding:2px 6px;border-radius:10px;background:${e.color}22;color:${e.color}">進行中</div>
        </div>`;
      });
      // タスク表示
      autoTasks.forEach(t=>{
        const isUrgent=t.urgent;
        const timeLabel=t.startTime?t.startTime:'';
        h+=`<div class="trow" style="${isUrgent?'background:#FFF8F0':''}">
          <button class="tck${t.done?' done':''}" onclick="toggleT('${key}','${t.id}');render()">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <span class="tlb">
            ${isUrgent?'⚡ ':'🕐 '}<span style="font-weight:600">${t.label}</span>
            ${timeLabel?'<span style="font-size:10px;color:var(--mu);margin-left:4px">'+timeLabel+'</span>':''}
          </span>
          <button onclick="toggleUrgent('${key}','${t.id}')" style="font-size:10px;padding:2px 6px;border-radius:4px;background:${isUrgent?'#FEE2E2':'var(--bg)'};border:1px solid ${isUrgent?'#DC2626':'var(--bd)'};cursor:pointer;color:${isUrgent?'#DC2626':'var(--mu)'}">
            ${isUrgent?'解除':'⚡'}
          </button>
        </div>`;
      });
    } else {
      // 時間マッチなし→手動で選べる
      const pendingTasks=dayTasks.filter(t=>!t.done);
      if(pendingTasks.length>0){
        h+=`<div style="padding:6px 12px;font-size:11px;color:var(--mu)">今の時間帯のタスクはありません。手動で選べます：</div>`;
        pendingTasks.slice(0,4).forEach(t=>{
          h+=`<div class="trow">
            <span class="tlb" style="color:var(--sub)">${t.label}</span>
            <button onclick="toggleUrgent('${key}','${t.id}')" style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;color:var(--ac)">今やる ⚡</button>
          </div>`;
        });
      } else {
        h+=`<div style="padding:12px;font-size:12px;color:var(--mu);text-align:center">今日のタスクはすべて完了です 🎉</div>`;
      }
    }
    h+=`</div>`;
    // 全タスクから追加ボタン（常時表示）
    const notShown=dayTasks.filter(t=>!t.done&&!t.urgent&&(!t.startTime||(strToTime(t.startTime)<nowT-1.5||strToTime(t.startTime)>nowT+1.5)));
    if(notShown.length>0){
      h+=`<div style="font-size:11px;color:var(--mu);padding:4px 12px 4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span>追加：</span>
        ${notShown.slice(0,4).map(t=>`<button onclick="toggleUrgent('${key}','${t.id}')" style="padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--bd);font-size:10px;cursor:pointer;color:var(--sub)">${t.label}</button>`).join('')}
      </div>`;
    }
  }
  h+=`<div class="sec"><span>タスク${dayTasks.length>0?(' ('+doneT+'/'+dayTasks.length+')'):''}</span></div>
  <div class="card">`;
  if(dayTasks.length===0)h+='<div class="empty">今日のタスクはまだありません</div>';
  else [...dayTasks].sort((a,b)=>{
    if(!a.startTime&&!b.startTime)return 0;
    if(!a.startTime)return 1;
    if(!b.startTime)return -1;
    return a.startTime.localeCompare(b.startTime);
  }).forEach(t=>{
    const timeStr=t.startTime?(t.endTime?`${t.startTime}〜${t.endTime} `:`${t.startTime} `):'';
    h+=`<div class="trow${t.done?' dt':''}">
      <button class="tck${t.done?' done':''}" style="${t.color&&!t.done?'border-color:'+t.color+';background:'+t.color+'22':''}" onclick="toggleT('${key}','${t.id}')" aria-label="${t.label}">

      <span class="tlb">${t.color?'<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+t.color+';margin-right:4px;vertical-align:middle"></span>':''}<span style="font-size:11px;color:var(--sub)">${timeStr}</span>${t.label}</span>
      <button class="tdl" onclick="delT('${key}','${t.id}')">×</button>

  });
  h+=`<div class="af">
    <input id="ti-${key}" placeholder="タスクを追加..." onkeydown="tkEnter(event,'${key}')">
    <button class="abtn" onclick="addTask('${key}')">追加</button>
  </div></div>
  <div class="sec"><span>スケジュール</span><span class="sec-edit" onclick="openSchEdit()">編集</span></div>
  <div class="card">`;
  for(let hr=6;hr<=22;hr++){
    for(let half=0;half<2;half++){
      const t=hr+(half*0.5);
      const slotEnd=t+0.5;
      const evs=schedule.filter(e=>e.days.includes(dow)&&e.start<slotEnd&&e.end>t);
      const label=half===0?`${hr}:00`:`${hr}:30`;
      const isHourBorder=half===0&&hr>6;
      h+=`<div class="tlr"><div class="tt">${half===0?hr+':00':''}</div><div class="tc${isHourBorder?' hb':''}">`;
      evs.forEach(e=>{

        if(isStart){
          h+=`<div class="ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color};cursor:pointer" onclick="openSchItemModal('${e.id}','${key}')">
            <span style="font-size:10px;opacity:.7">${timeToStr(e.start)}〜${timeToStr(e.end)}</span> ${e.label}
            ${schNotes[e.id+'_'+key]?'<span style="font-size:9px;opacity:0.7"> 📝</span>':''}
          </div>`;

          h+=`<div class="ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color};opacity:.6">↳ ${e.label}</div>`;
        }

  h+=`</div><div class="sec"><span>今日の習慣</span><span class="sec-edit" onclick="sw('settings')">編集</span></div><div class="card">`;
  habits.forEach((hb,i)=>{

      ${hb.timerMins&&!done?buildHabitTimerBtn(hb,key):''}
      <button class="hck${done?' done':''}" style="${done?('background:'+hb.color+';border-color:'+hb.color):''}" onclick="toggleH('${hb.id}','${key}')" aria-label="${hb.name}">

function timeToStr(t){
  const h=Math.floor(t),m=Math.round((t%1)*60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function strToTime(s){
  const [h,m]=s.split(':').map(Number);
  return h+(m/60);
}

function schToggleDay(si,di,checked){
  if(checked){if(!schedule[si].days.includes(di))schedule[si].days.push(di);schedule[si].days.sort();}
  else schedule[si].days=schedule[si].days.filter(d=>d!==di);
  save();
}

function addH(){
  const icon=document.getElementById('ni').value.trim()||'⭐';
  const name=document.getElementById('nn').value.trim();
  if(!name)return;
  const timerMins=parseInt(document.getElementById('nt')?.value||'0')||0;
  habits.push({id:'h'+Date.now(),name,icon,color:'#888',timerMins:timerMins||null});
  save();toast('習慣を追加しました！');render();
}

function startHabitTimer(hid,key,mins){
  if(timerRunning)stopTimer();
  timerActiveItem={habitId:hid,habitKey:key};
  timerRunning=true;
  timerPaused=false;
  timerSeconds=0;
  timerTotal=mins*60;
  const hb=habits.find(h=>h.id===hid);
  showOverlay((hb?hb.icon+' '+hb.name:'🧘 瞑想中'));
  timerInterval=setInterval(()=>{
    timerSeconds++;
    updateTimerDisplay();
    updateOverlay();
    if(timerSeconds>=timerTotal){
      clearInterval(timerInterval);
      timerRunning=false;
      hideOverlay();
      // Mark habit as done
      if(!data[key])data[key]={};
      data[key][hid]=true;
      playTimerEnd();
      toast('⏰ '+(hb?hb.name:'習慣')+'完了！✅');
      save();
      render();
    }
  },1000);
}

function toggleRecurringDay(i,d,checked){
  if(checked){if(!recurringTasks[i].days.includes(d))recurringTasks[i].days.push(d);recurringTasks[i].days.sort();}
  else recurringTasks[i].days=recurringTasks[i].days.filter(x=>x!==d);
  save();applyRecurringTasks();render();
}

function deleteRecurring(i){
  if(!confirm('削除しますか？'))return;
  const id=recurringTasks[i].id;
  recurringTasks.splice(i,1);
  // 未完了の繰り返しタスクを削除
  Object.keys(tasks).forEach(k=>{
    tasks[k]=tasks[k].filter(t=>t.recurringId!==id);
  });
  save();render();
}

function getTreeProgress(){
  try {
    const dates=getWk();
    let score=0;
    (dreamData.dreams||[]).forEach(dream=>{
      (dream.cats||[]).forEach(cat=>{
        const pct=getMandalaProgress(cat);
        score+=Math.round(pct*5);
      });
    });
    if(typeof habits!=='undefined'){
      dates.forEach(d=>{
        const k=dk(d);
        habits.forEach(h=>{if(data[k]&&data[k][h.id])score+=0.5;});
      });
    }
    return Math.min(Math.round(score),60);
  } catch(e){ return 0; }
}

function drawTree(progress){
  const pct=progress/60;
  const now=new Date();
  const monthIdx=now.getMonth();
  const flower=FLOWERS[monthIdx%FLOWERS.length];
  const animal=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  const leafCount=Math.floor(pct*12);
  const trunkH=60+pct*40;
  const branches=pct>0.2;
  const hasFlowers=pct>0.5;
  const hasAnimal=pct>0.3;
  const hasApples=pct>0.8;

  // Generate leaf positions
  const leaves=[];
  for(let i=0;i<leafCount;i++){
    const angle=(i/leafCount)*Math.PI*2;
    const r=30+Math.random()*25;
    const x=160+Math.cos(angle)*r;
    const y=120-Math.sin(angle)*r*0.7;
    leaves.push({x,y,r:8+Math.random()*6});
  }

  let svg=`<svg class="tree-svg" viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
    <!-- Sky background -->
    <defs>
      <radialGradient id="sunGrad" cx="80%" cy="20%">
        <stop offset="0%" stop-color="#FFE066" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="320" height="280" fill="transparent"/>
    <!-- Sun -->
    <circle cx="260" cy="40" r="25" fill="url(#sunGrad)"/>
    <circle cx="260" cy="40" r="16" fill="#FFE066" opacity="0.9"/>
    <!-- Ground -->
    <ellipse cx="160" cy="260" rx="80" ry="12" fill="#5A8A5A" opacity="0.5"/>
    <!-- Trunk -->
    <rect x="152" y="${220-trunkH}" width="16" height="${trunkH}" rx="4" fill="#8B6914"/>`;

  if(branches&&pct>0.2){
    const bh=220-trunkH+20;
    svg+=`<line x1="160" y1="${bh}" x2="${120+pct*20}" y2="${bh-30}" stroke="#8B6914" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="${bh+10}" x2="${195-pct*10}" y2="${bh-20}" stroke="#8B6914" stroke-width="5" stroke-linecap="round"/>`;
  }

  // Leaves (canopy)
  if(pct>0.1){
    const canopyY=155-pct*30;
    const canopyR=40+pct*35;
    svg+=`<ellipse cx="160" cy="${canopyY}" rx="${canopyR}" ry="${canopyR*0.8}" fill="#4CAF50" opacity="0.85"/>`;
    svg+=`<ellipse cx="${140-pct*5}" cy="${canopyY+10}" rx="${canopyR*0.7}" ry="${canopyR*0.6}" fill="#66BB6A" opacity="0.6"/>`;
    svg+=`<ellipse cx="${175+pct*5}" cy="${canopyY+15}" rx="${canopyR*0.65}" ry="${canopyR*0.55}" fill="#388E3C" opacity="0.5"/>`;
  }

  // Flowers/fruits
  if(hasFlowers){
    const positions=[[140,130],[175,125],[155,115],[185,140],[130,145]];
    positions.slice(0,Math.floor(pct*5)).forEach(([x,y])=>{
      svg+=`<text x="${x}" y="${y}" font-size="14" text-anchor="middle">${flower}</text>`;
    });
  }

  // Apples/fruits
  if(hasApples){
    svg+=`<text x="145" y="155" font-size="12">🍎</text>`;
    svg+=`<text x="170" y="160" font-size="12">🍎</text>`;
  }

  // Animal
  if(hasAnimal){
    svg+=`<text x="220" y="180" font-size="20">${animal}</text>`;
  }

  // Progress label
  svg+=`<text x="160" y="272" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">成長スコア: ${progress}/60 🌱</text>`;

  svg+='</svg>';
  return svg;
}

function getDreamWater(dream){
  try {
    let score=0;
    let total=0;
    // Mandala cats
    const cats=dream.cats||[];
    cats.forEach(cat=>{score+=getMandalaProgress(cat);total++;});
    // Linked habits
    const today=dk(new Date());
    (dream.linkedHabits||[]).forEach(hid=>{
      total++;
      if(data[today]&&data[today][hid])score++;
    });
    // Linked study
    (dream.linkedStudy||[]).forEach(sid=>{
      const sl=studyLists.find(s=>s.id===sid);
      if(sl){
        const done=sl.items.filter(i=>i.done).length;
        const tot=sl.items.length;
        if(tot>0){score+=done/tot;total++;}
      }
    });
    return total>0?Math.min(score/total,1):0;
  } catch(e){return 0;}
}

function getMandalaProgress(cat){
  try {
    const items=cat.items||[];
    if(items.length===0)return 0;
    const itemDone=items.filter(i=>i.doneToday).length/items.length;
    let syncScore=0;
    if(cat.syncType==='habit'&&typeof habits!=='undefined'&&habits.length>0){
      const today=dk(new Date());
      const total=habits.length;
      const done=habits.filter(h=>data[today]&&data[today][h.id]).length;
      syncScore=total>0?done/total:0;
    } else if(cat.syncType==='study'&&typeof studyLists!=='undefined'){
      const ids=cat.syncIds||[];
      const lists=ids.length>0?studyLists.filter(sl=>ids.includes(sl.id)):studyLists;
      let done=0,total=0;
      lists.forEach(sl=>{
        total+=(sl.items||[]).length;
        done+=(sl.items||[]).filter(i=>i.done).length;
      });
      syncScore=total>0?done/total:0;
    }
    return Math.min((itemDone+syncScore)/2*1.5,1);
  } catch(e){ return 0; }
}

function getMandalaSync(cat){
  try {
    if(cat.syncType==='habit'&&typeof habits!=='undefined'){
      const today=dk(new Date());
      const done=habits.filter(h=>data[today]&&data[today][h.id]).length;
      return `習慣 ${done}/${habits.length}`;
    } else if(cat.syncType==='study'&&typeof studyLists!=='undefined'){
      const ids=cat.syncIds||[];
      const lists=ids.length>0?studyLists.filter(sl=>ids.includes(sl.id)):studyLists;
      let done=0,total=0;
      lists.forEach(sl=>{
        total+=(sl.items||[]).length;
        done+=(sl.items||[]).filter(i=>i.done).length;
      });
      return `学習 ${done}/${total}`;
    }
    return '';
  } catch(e){ return ''; }
}

function checkWeeklyReset(){
  const lastReset=localStorage.getItem('yp_last_reset');
  const now=new Date();
  const monday=new Date(now);
  monday.setDate(now.getDate()-(now.getDay()===0?6:now.getDay()-1));
  monday.setHours(0,0,0,0);
  const mondayStr=dk(monday);
  if(lastReset!==mondayStr){
    studyLists.forEach(sl=>sl.items.forEach(item=>item.done=false));
    localStorage.setItem('yp_last_reset',mondayStr);
    saveStudy();
  }
}

let timerPaused=false;

function showOverlay(label){
  const overlay=document.getElementById('timer-overlay');
  const bg=document.getElementById('timer-bg');
  const randomBg=bgImages[Math.floor(Math.random()*bgImages.length)];
  bg.style.backgroundImage=`url(${randomBg})`;
  document.getElementById('overlay-label').textContent=label||'集中中';
  overlay.classList.add('active');
  updateOverlay();
}

function hideOverlay(){
  document.getElementById('timer-overlay').classList.remove('active');
}

function updateOverlay(){
  const el=document.getElementById('overlay-time');
  const bar=document.getElementById('overlay-bar');
  if(!el)return;
  const remaining=timerTotal-timerSeconds;
  const m=Math.floor(remaining/60);
  const s=remaining%60;
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if(bar)bar.style.width=`${((timerTotal-timerSeconds)/timerTotal)*100}%`;
}

function togglePause(){
  const btn=document.getElementById('overlay-pause-btn');
  if(timerPaused){
    timerPaused=false;
    if(btn)btn.textContent='⏸ 一時停止';
    timerInterval=setInterval(timerTick,1000);
  } else {
    timerPaused=true;
    if(btn)btn.textContent='▶ 再開';
    clearInterval(timerInterval);
  }
}

function timerTick(){
  timerSeconds++;
  const today=dk(new Date());
  studyLog[today]=(studyLog[today]||0)+1;
  saveStudy();
  updateTimerDisplay();
  updateOverlay();
  if(timerSeconds>=timerTotal){
    stopTimerOverlay();
    playTimerEnd();toast('⏰ お疲れ様でした！');
    if(timerActiveItem){
      studyLists[timerActiveItem.listIdx].items[timerActiveItem.itemIdx].done=true;
      saveStudy();
      renderStudy();
    }
  }
}

function startTimer(listIdx,itemIdx){
  if(timerRunning)stopTimer();
  timerActiveItem={listIdx,itemIdx};
  timerRunning=true;
  timerPaused=false;
  timerSeconds=0;
  const customMins=parseInt(document.getElementById('timer-mins')?.value||'25');
  timerTotal=customMins*60;
  timerInterval=setInterval(timerTick,1000);
  const label=studyLists[listIdx]?.items[itemIdx]?.label||'集中中';
  showOverlay(label);
  renderStudy();
}

function stopTimer(){
  clearInterval(timerInterval);
  timerRunning=false;
  timerPaused=false;
  timerInterval=null;
  hideOverlay();
  renderStudy();
}

function stopTimerOverlay(){
  stopTimer();
}

function updateTimerDisplay(){

  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

      html+=`<div class="card" style="margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)">
          <div style="width:10px;height:10px;border-radius:50%;background:${sl.color};flex-shrink:0"></div>
          <input value="${sl.name}" onchange="studyLists[${li}].name=this.value;saveStudy()" style="flex:1;font-size:13px;font-weight:600;border:none;background:transparent;outline:none;color:var(--tx)">
          <button class="delbtn" onclick="studyLists.splice(${li},1);saveStudy();renderStudy()">×</button>
        </div>
        ${sl.items.map((item,ii)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)">
          <input value="${item.label}" onchange="studyLists[${li}].items[${ii}].label=this.value;saveStudy()" style="flex:1;font-size:12px;border:none;background:transparent;outline:none;color:var(--tx)">
          <button class="delbtn" style="width:22px;height:22px;font-size:11px" onclick="studyLists[${li}].items.splice(${ii},1);saveStudy();renderStudy()">×</button>
        </div>`).join('')}
        <div style="padding:8px 12px;display:flex;gap:6px">
          <input id="new-item-${li}" placeholder="項目を追加" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--bd);font-size:12px;outline:none;background:var(--bg)">
          <button class="abtn" style="font-size:12px;padding:6px 10px" onclick="addStudyItem(${li})">追加</button>
        </div>
      </div>`;
    });
    html+=`<div style="display:flex;gap:6px;margin-top:8px">
      <input id="new-list-name" placeholder="新しい科目を追加" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)">
      <button class="abtn" onclick="addStudyList()">追加</button>
    </div>`;
  } else {
    studyLists.forEach((sl,li)=>{
      const done=sl.items.filter(i=>i.done).length;
      const total=sl.items.length;
      html+=`<div class="card" style="margin-bottom:8px">
        <div style="padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px">
          <div style="width:10px;height:10px;border-radius:50%;background:${sl.color};flex-shrink:0"></div>
          <span style="font-size:13px;font-weight:600;flex:1">${sl.name}</span>
          <span style="font-size:11px;color:var(--mu)">${done}/${total}</span>
        </div>
        ${sl.items.map((item,ii)=>`
        <div class="study-item">
          <button class="study-check${item.done?' done':''}" onclick="toggleStudyItem(${li},${ii})" aria-label="${item.label}">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <span style="flex:1;font-size:13px;${item.done?'text-decoration:line-through;color:var(--mu)':''}">${item.label}</span>
          ${!timerRunning?('<button onclick="startTimer('+li+','+ii+')" style="padding:4px 8px;border-radius:6px;background:'+sl.color+'22;border:1px solid '+sl.color+';color:'+sl.color+';font-size:11px;cursor:pointer">▶ 開始</button>'):''}
        </div>`).join('')}
      </div>`;
    });
  }

  document.getElementById('view-study').innerHTML=html;
}

function toggleStudyItem(li,ii){
  studyLists[li].items[ii].done=!studyLists[li].items[ii].done;
  if(studyLists[li].items[ii].done)playPing();
  saveStudy();
  renderStudy();
}

function addStudyItem(li){
  const inp=document.getElementById('new-item-'+li);
  if(!inp||!inp.value.trim())return;
  studyLists[li].items.push({id:'i'+Date.now(),label:inp.value.trim(),done:false});
  saveStudy();
  renderStudy();
}

function addStudyList(){
  const inp=document.getElementById('new-list-name');
  if(!inp||!inp.value.trim())return;
  const colors=['#2D6A8F','#6A3A8F','#1A2E3A','#9B6AD4','#E8856A','#5A8A6A'];
  studyLists.push({id:'sl'+Date.now(),name:inp.value.trim(),color:colors[studyLists.length%colors.length],items:[]});
  saveStudy();
  renderStudy();
}

checkWeeklyReset();

render();
</script>
</body>
</html>
