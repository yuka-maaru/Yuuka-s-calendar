<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yuka's Planner</title>
<style>
:root{--bg:#F7F4EF;--sur:#FFF;--bd:#E8E2D9;--tx:#1A2030;--sub:#6B7280;--mu:#9CA3AF;--ac:#2D6A8F;--r:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:0 auto}
.app{padding:0 0 80px}
header{padding:18px 16px 8px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:22px;height:22px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ht h1{font-size:17px;font-weight:700}
.ht p{font-size:11px;color:var(--sub);font-style:italic}
.si{margin-left:auto;font-size:10px;color:var(--mu);display:flex;align-items:center;gap:4px;transition:opacity .3s}
.sd{width:6px;height:6px;border-radius:50%;background:#10B981}
.nav{display:flex;background:var(--sur);border-top:1px solid var(--bd);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 4px 12px;background:none;border:none;font-size:10px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nav button.active{color:var(--ac)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.view{display:none;padding:0 16px}
.view.active{display:block}
.card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:12px;overflow:hidden}
.sec{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between}
.sec-edit{font-size:11px;color:var(--ac);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.dnav{display:flex;align-items:center;gap:10px;padding:10px 0}
.dnav button{width:32px;height:32px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dtitle{flex:1;font-size:16px;font-weight:700}
.dsub{font-size:12px;color:var(--sub);font-weight:400}
.tlr{display:grid;grid-template-columns:42px 1fr}
.tt{font-size:10px;color:var(--mu);text-align:right;padding:10px 8px 0 0}
.tc{border-left:1px solid var(--bd);padding:5px 0 5px 8px;min-height:46px}
.tc.hb{border-top:1px solid var(--bd)}
.ev{padding:5px 8px;margin-bottom:3px;font-size:12px;font-weight:500;border-left:3px solid;line-height:1.3}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.hrow:last-child{border-bottom:none}
.hic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hin{flex:1}
.hn{font-size:14px;font-weight:500}
.hs{font-size:11px;color:var(--sub);margin-top:1px}
.hck{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.hck svg{width:13px;height:13px;stroke:white;stroke-width:2.8;fill:none;opacity:0;transition:opacity .15s}
.hck.done svg{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:12px;text-align:center}
.sn{font-size:24px;font-weight:700}
.sl{font-size:11px;color:var(--sub);margin-top:2px}
.wgw{overflow-x:auto}
.wgt{width:100%;border-collapse:collapse;min-width:300px;table-layout:fixed}
.wgt th{font-size:11px;color:var(--sub);font-weight:500;padding:8px 3px;text-align:center;border-bottom:1px solid var(--bd);background:var(--sur);white-space:nowrap}
.wgt th.tc2{color:var(--ac)}
.wgt td{padding:2px;border-bottom:1px solid #F3F0EB;vertical-align:top;height:34px}
.wgt td:first-child{font-size:10px;color:var(--mu);text-align:right;padding-right:5px;background:var(--bg);width:34px}
.wgev{font-size:9px;padding:2px 3px;border-left:2px solid;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnav{display:flex;align-items:center;gap:10px;padding:16px 0 8px}
.cnav button{width:36px;height:36px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.cnav button:hover{background:var(--bg)}
.ctitle{flex:1;font-size:20px;font-weight:700;text-align:center}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.chdr{text-align:center;font-size:11px;color:var(--sub);font-weight:500;padding:5px 0}
.ccell{background:var(--sur);border-radius:6px;padding:4px 3px;min-height:56px;border:1px solid transparent;cursor:pointer;transition:border-color .15s}
.ccell:active{border-color:var(--ac)}
.ccell.om{opacity:.3;background:transparent;cursor:default}
.ccell.td{border-color:var(--ac)}
.ccell.sel{border-color:var(--ac);background:#EBF3F8}
.cdt{font-size:12px;font-weight:500;text-align:center;margin-bottom:2px}
.ccell.td .cdt{color:var(--ac);font-weight:700}
.cdots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.cdot{width:5px;height:5px;border-radius:50%}
.ctc{font-size:9px;color:var(--sub);text-align:center;margin-top:1px}
.set-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.set-row:last-child{border-bottom:none}
.sri{flex:1;min-width:0}
.sri input{font-size:13px;border:none;background:transparent;width:100%;outline:none;color:var(--tx)}
.srs{font-size:11px;color:var(--sub)}
.srs input{border:none;background:transparent;font-size:13px;outline:none;width:28px;display:inline}
.cpick{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;overflow:hidden}
.delbtn{width:26px;height:26px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:13px;color:#DC2626;flex-shrink:0}
.af{padding:12px 14px;border-top:1px solid var(--bd);display:flex;gap:6px}
.af input{padding:8px 10px;border-radius:8px;border:1px solid var(--bd);font-size:13px;background:var(--bg);outline:none;flex:1}
.af input:focus{border-color:var(--ac)}
.eji{width:38px;text-align:center;flex-shrink:0;flex:none}
.abtn{padding:8px 14px;border-radius:8px;background:var(--ac);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A2030;color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
.trow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.trow:last-child{border-bottom:none}
.trow.dt .tlb{text-decoration:line-through;color:var(--mu)}
.tlb{flex:1;font-size:14px}
.tck{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.tck.done{background:#10B981;border-color:#10B981}
.tck svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none;opacity:0}
.tck.done svg{opacity:1}
.tdl{width:22px;height:22px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:12px;color:#DC2626;flex-shrink:0}
.empty{padding:20px;text-align:center;color:var(--mu);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sur);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-size:16px;font-weight:700;margin-bottom:4px}
.modal p{font-size:12px;color:var(--sub);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sch-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sch-edit-row:last-child{border-bottom:none}
.sch-edit-row input[type=text]{flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)}
.sch-edit-row input[type=text]:focus{border-color:var(--ac)}
.memo-box{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg);resize:vertical;min-height:80px;font-family:inherit;line-height:1.5}
.memo-box:focus{border-color:var(--ac)}
.memo-saved{font-size:11px;color:var(--mu);margin-top:4px;transition:opacity .3s}
.mandala-wrap{width:100%;position:relative;margin:12px 0}
.mandala-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:340px;margin:0 auto}
.mandala-center{grid-column:2;grid-row:2;background:linear-gradient(135deg,var(--ac),#7A4FA0);color:white;border-radius:12px;padding:10px 6px;text-align:center;font-size:11px;font-weight:700;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(45,106,143,.3)}
.mandala-cat{background:var(--sur);border:1.5px solid var(--bd);border-radius:12px;padding:6px 4px;text-align:center;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.mandala-cat:hover{border-color:var(--ac);transform:scale(1.02)}
.mandala-cat.active{border-color:var(--ac)}
.mandala-water{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(45,106,143,.15),rgba(45,106,143,.35));transition:height .5s ease;border-radius:0 0 10px 10px}
.mandala-cat-icon{font-size:18px;position:relative;z-index:1}
.mandala-cat-name{font-size:10px;font-weight:600;color:var(--tx);position:relative;z-index:1;line-height:1.2}
.mandala-cat-pct{font-size:9px;color:var(--ac);font-weight:600;position:relative;z-index:1}
.mandala-sync{font-size:8px;color:var(--mu);position:relative;z-index:1;line-height:1.2}
.mandala-detail{background:var(--sur);border-radius:12px;border:1px solid var(--bd);padding:12px;margin:8px 0}
.mandala-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.mandala-item:last-child{border-bottom:none}
.mandala-item-label{flex:1;font-size:13px}
.mandala-timer-btn{padding:5px 10px;border-radius:8px;background:var(--ac)22;border:1px solid var(--ac);color:var(--ac);font-size:11px;cursor:pointer}
.mandala-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.mandala-check.done{background:#10B981;border-color:#10B981}
.mandala-check svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none}
.dream-tree-wrap{width:100%;text-align:center;margin:8px 0;position:relative;overflow:hidden;border-radius:var(--r);background:linear-gradient(180deg,#87CEEB 0%,#98D8C8 60%,#7CBA6E 60%,#5A8A5A 100%);min-height:280px}
.tree-svg{width:100%;max-width:320px;height:280px}
.dream-section{margin-bottom:16px}
.dream-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.dream-item:last-child{border-bottom:none}
.dream-input{flex:1;border:none;background:transparent;outline:none;font-size:13px;color:var(--tx);font-family:inherit;resize:none;min-height:20px}
.goal-card{background:var(--sur);border-radius:8px;border:1px solid var(--bd);padding:10px 12px;margin-bottom:6px}
.goal-month{font-size:11px;font-weight:600;color:var(--sub);margin-bottom:4px}
.goal-inp{width:100%;border:none;background:transparent;outline:none;font-size:13px;color:var(--tx);font-family:inherit}
.reverse-card{background:linear-gradient(135deg,#EBF3F8,#F5F0FF);border-radius:8px;border:1px solid var(--bd);padding:12px;margin-bottom:8px}
.reverse-arrow{text-align:center;color:var(--mu);font-size:18px;margin:4px 0}
.timer-circle{width:140px;height:140px;border-radius:50%;background:conic-gradient(var(--ac) 0deg,var(--bd) 0deg);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;transition:background 0.5s}
.timer-inner{width:110px;height:110px;border-radius:50%;background:var(--sur);display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-time{font-size:24px;font-weight:700;color:var(--tx)}
.timer-label{font-size:11px;color:var(--mu)}
.study-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
.study-item:last-child{border-bottom:none}
.study-item.active{background:var(--bg)}
.study-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.study-check.done{background:#10B981;border-color:#10B981}
.study-check svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none;opacity:0}
.study-check.done svg{opacity:1}
.play-btn{padding:10px 28px;border-radius:20px;background:var(--ac);color:white;border:none;font-size:14px;font-weight:600;cursor:pointer}
.stop-btn{padding:10px 28px;border-radius:20px;background:#DC2626;color:white;border:none;font-size:14px;font-weight:600;cursor:pointer}
#timer-overlay{position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000}
#timer-overlay.active{display:flex}
#timer-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0.7;transition:opacity 1s}
#timer-overlay-content{position:relative;z-index:1;text-align:center;color:white}
.overlay-time{font-size:80px;font-weight:200;letter-spacing:4px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.overlay-label{font-size:16px;opacity:0.8;margin-bottom:40px;letter-spacing:2px}
.overlay-pause{padding:14px 40px;border-radius:30px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:white;font-size:16px;cursor:pointer;backdrop-filter:blur(8px);transition:background .2s}
.overlay-pause:hover{background:rgba(255,255,255,0.25)}
.overlay-stop{margin-top:16px;padding:10px 30px;border-radius:30px;background:rgba(220,38,38,0.5);border:1px solid rgba(220,38,38,0.6);color:white;font-size:14px;cursor:pointer;backdrop-filter:blur(8px)}
.overlay-progress{width:200px;height:3px;background:rgba(255,255,255,0.2);border-radius:2px;margin:24px auto}
.overlay-progress-bar{height:100%;background:white;border-radius:2px;transition:width 1s linear}
.sch-edit-row .delbtn{flex-shrink:0}
</style>
</head>
<body>
<div id="focus-overlay" style="position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,15,30,0.97)">
  <div style="color:white;text-align:center;padding:24px;max-width:360px;width:100%">
    <div style="font-size:40px;margin-bottom:8px">🎯</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:4px" id="focus-label">集中モード</div>
    <div id="focus-task-list" style="margin:10px 0 16px;text-align:left"></div>
    <div id="focus-timer-display" style="font-size:60px;font-weight:200;letter-spacing:6px;margin-bottom:8px;font-variant-numeric:tabular-nums">25:00</div>
    <div id="focus-mode-label" style="font-size:12px;opacity:0.5;margin-bottom:20px">集中中</div>
    
    <!-- Noise selector -->
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px" id="noise-btns">
      <button onclick="toggleNoise('none')" id="noise-none" style="padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.2);border:none;color:white;font-size:11px;cursor:pointer">🔇 なし</button>
      <button onclick="toggleNoise('rain')" id="noise-rain" style="padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.1);border:none;color:white;font-size:11px;cursor:pointer">🌧️ 雨</button>
      <button onclick="toggleNoise('cafe')" id="noise-cafe" style="padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.1);border:none;color:white;font-size:11px;cursor:pointer">☕ カフェ</button>
      <button onclick="toggleNoise('wave')" id="noise-wave" style="padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.1);border:none;color:white;font-size:11px;cursor:pointer">🌊 波</button>
      <button onclick="toggleNoise('white')" id="noise-white" style="padding:6px 10px;border-radius:12px;background:rgba(255,255,255,0.1);border:none;color:white;font-size:11px;cursor:pointer">〰️ WN</button>
    </div>
    
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button onclick="toggleFocusPause()" id="focus-pause-btn" style="padding:10px 18px;border-radius:20px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;font-size:14px;cursor:pointer">⏸ 一時停止</button>
      <button onclick="startFocusBreak()" style="padding:10px 18px;border-radius:20px;background:rgba(16,185,129,0.3);border:1px solid rgba(16,185,129,0.5);color:white;font-size:14px;cursor:pointer">☕ 休憩</button>
      <button onclick="exitFocusMode()" style="padding:10px 18px;border-radius:20px;background:rgba(220,38,38,0.4);border:1px solid rgba(220,38,38,0.5);color:white;font-size:14px;cursor:pointer">✕ 終了</button>
    </div>
    <div style="margin-top:16px;font-size:11px;opacity:0.3">Strict Mode: 他のタブはロックされています</div>
  </div>
</div>
<div id="timer-overlay">
  <div id="timer-bg"></div>
  <div id="timer-overlay-content">
    <div class="overlay-label" id="overlay-label">集中中</div>
    <div class="overlay-time" id="overlay-time">25:00</div>
    <div class="overlay-progress"><div class="overlay-progress-bar" id="overlay-bar" style="width:100%"></div></div>
    <button class="overlay-pause" id="overlay-pause-btn" onclick="togglePause()">⏸ 一時停止</button>
    <br>
    <button class="overlay-stop" onclick="stopTimerOverlay()">⏹ 終了</button>
  </div>
</div>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="ht">
      <h1>Yuka's Planner</h1>
      <p>Make my dreams come true today.</p>
    </div>
    <div class="si" id="si" style="opacity:0">
      <div class="sd"></div><span>保存済み</span>
    </div>
  </header>

  <div id="view-today" class="view active"></div>
  <div id="view-habits" class="view"></div>
  <div id="view-week" class="view"></div>
  <div id="view-month" class="view"></div>
  <div id="view-settings" class="view"></div>
  <div id="view-dream" class="view"></div>
  <div id="view-memo" class="view"></div>
  <div id="view-study" class="view"></div>

  <nav class="nav">
    <button class="active" onclick="sw('today')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div>今日
    </button>
    <button onclick="sw('habits')">
      <div class="ni"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>習慣
    </button>
    <button onclick="sw('week')">
      <div class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>週間

let recurringApplied=false;
function applyRecurringTasks(force=false){
  if(recurringApplied&&!force)return;
  recurringApplied=true;
  // Generate from Aug 24 2026 to Dec 18 2026 (entire semester)
  const semStart=new Date(2026,7,24); // Aug 24
  const semEnd=new Date(2026,11,18); // Dec 18
  
  // Remove ALL existing recurring task instances
  Object.keys(tasks).forEach(k=>{
    tasks[k]=(tasks[k]||[]).filter(t=>!t.recurringId);
  });

  // Find Monday of semester start week
  const startDow=semStart.getDay();
  const firstMonday=new Date(semStart);
  firstMonday.setDate(semStart.getDate()-(startDow===0?6:startDow-1));
  firstMonday.setHours(0,0,0,0);
  
  // Count weeks in semester
  const msPerWeek=7*24*60*60*1000;
  const totalWeeks=Math.ceil((semEnd-firstMonday)/msPerWeek)+1;
  
  for(let weekOffset=0;weekOffset<totalWeeks;weekOffset++){
    recurringTasks.forEach(rt=>{
      (rt.days||[]).forEach(d=>{
        // JS: 0=Sun,1=Mon...6=Sat
        // Mon-start offset: Mon=0,Tue=1,...,Sun=6
        const dayOffset=d===0?6:d-1;
        const target=new Date(firstMonday);
        target.setDate(firstMonday.getDate()+weekOffset*7+dayOffset);
        const k=dk(target);
        if(!tasks[k])tasks[k]=[];
        if(!tasks[k].some(t=>t.recurringId===rt.id)){
          tasks[k].push({id:'r'+rt.id+'_'+k,label:rt.label,done:false,recurringId:rt.id});
        }
      });
    });
  }
  save();
}

    const tasksToSave={};
    Object.keys(tasks).forEach(k=>{
      const nonRecurring=(tasks[k]||[]).filter(t=>!t.recurringId);
      if(nonRecurring.length>0)tasksToSave[k]=nonRecurring;

function dk(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function getD(o){const d=new Date();d.setDate(d.getDate()+o);return d}
function getWk(){
  const n=new Date(),dow=n.getDay(),m=new Date(n);
  m.setDate(n.getDate()-(dow===0?6:dow-1)+weekOff*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});
}
function streak(hid){
  let s=0;const n=new Date();
  for(let i=0;i<365;i++){const d=new Date(n);d.setDate(n.getDate()-i);const k=dk(d);if(data[k]&&data[k][hid])s++;else if(i>0)break;}
  return s;
}

  const v=inp.value.trim();if(!v)return;
  const startTime=document.getElementById('modal-start')?.value||'';
  const endTime=document.getElementById('modal-end')?.value||'';
  const color=document.getElementById('modal-color')?.value||'';
  if(!tasks[key])tasks[key]=[];
  tasks[key].push({id:'t'+Date.now(),label:v,done:false,startTime,endTime,color:color||undefined});
  inp.value='';
  if(document.getElementById('modal-start'))document.getElementById('modal-start').value='';
  if(document.getElementById('modal-end'))document.getElementById('modal-end').value='';
  save();
  refreshModal(key);
  render();
}

    [...dayTasks].sort((a,b)=>{
      if(!a.startTime&&!b.startTime)return 0;
      if(!a.startTime)return 1;
      if(!b.startTime)return -1;
      return a.startTime.localeCompare(b.startTime);
    }).forEach(t=>{
      const timeStr=t.startTime?(t.endTime?`${t.startTime}〜${t.endTime} `:`${t.startTime} `):'';
      html+=`<div>
        <div class="trow${t.done?' dt':''}">
          <button class="tck${t.done?' done':''}" onclick="toggleT('${key}','${t.id}');refreshModal('${key}')">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <span class="tlb" onclick="toggleTaskNote('${t.id}')" style="cursor:pointer"><span style="font-size:11px;color:var(--sub)">${timeStr}</span>${t.label}</span>

let swipeTouchStartY=0;
document.addEventListener('touchstart',e=>{
  const modal=e.target.closest('.modal');
  if(modal)swipeTouchStartY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  const modal=e.target.closest('.modal');
  if(!modal)return;
  const dy=e.changedTouches[0].clientY-swipeTouchStartY;
  if(dy>80){closeModal();}
},{passive:true});

function openTimeSlot(key,t){
  // Detect free time around this slot
  const [ky,km,kd]=key.split('-').map(Number);
  const d=new Date(ky,km-1,kd);
  const dow=d.getDay();
  
  // Find what's scheduled around this time
  const dayEvs=schedule.filter(e=>e.days.includes(dow));
  
  // Find free block: next event after t
  const nextEv=dayEvs.filter(e=>e.start>t).sort((a,b)=>a.start-b.start)[0];
  const freeUntil=nextEv?nextEv.start:22; // free until next event or 10pm
  const freeHours=Math.round((freeUntil-t)*10)/10;
  
  // Is this slot already busy?
  const busyNow=dayEvs.some(e=>e.start<=t&&e.end>t);
  if(busyNow){
    // Just open normal day modal
    openDayModal(key);
    return;

  const timeStr=timeToStr(t);
  const untilStr=timeToStr(freeUntil);
  
  // Build all suggestions
  const studySuggestions=[];
  studyLists.forEach(sl=>{
    sl.items.filter(it=>!it.done).forEach(it=>{

let freeSessionLabel='';
let freeSessionEndTime=null;
let freeSessionStudyIdx={li:-1,ii:-1};

function switchFreeTab(tabOrEl){
  const tab=typeof tabOrEl==='string'?tabOrEl:tabOrEl.dataset?.tab||tabOrEl;
  ['study','task','dream'].forEach(t2=>{
    const panel=document.getElementById('free-tab-'+t2);
    const btn=document.getElementById('ftab-'+t2);
    if(panel)panel.style.display=t2===tab?'block':'none';
    if(btn){btn.style.background=t2===tab?'var(--ac)':'transparent';btn.style.color=t2===tab?'white':'var(--mu)';}
  });
  // Reset selection
  document.querySelectorAll('[id^=free-tab-] button').forEach(b=>{
    const c=b.getAttribute('data-color')||'#888';
    b.style.border='1.5px solid var(--bd)';
    b.style.background=b.getAttribute('data-type')==='custom'?'var(--sur)':c+'18';
  });
  document.getElementById('custom-input-area').style.display='none';
  freeSessionLabel='';freeSessionStudyIdx={li:-1,ii:-1};
  checkSessionReady();
}

function selectFreeItem(btn){
  // Deselect all in current tab
  const tabPanels=btn.closest('[id^=free-tab-]');
  if(tabPanels){
    tabPanels.querySelectorAll('button').forEach(b=>{
      const c=b.getAttribute('data-color')||'#888';
      b.style.border='1.5px solid var(--bd)';
      b.style.background=b.getAttribute('data-type')==='custom'?'var(--sur)':c+'18';
    });
  }
  btn.style.border='1.5px solid var(--ac)';
  btn.style.background=(btn.getAttribute('data-color')||'#2D6A8F')+'33';
  
  const type=btn.getAttribute('data-type');
  const customArea=document.getElementById('custom-input-area');
  if(type==='custom'){
    customArea.style.display='block';
    freeSessionLabel='';
    freeSessionStudyIdx={li:-1,ii:-1};
    setTimeout(()=>document.getElementById('free-study-label')?.focus(),100);
  } else {
    customArea.style.display='none';
    freeSessionLabel=btn.getAttribute('data-label');
    freeSessionStudyIdx={
      li:parseInt(btn.getAttribute('data-li')),
      ii:parseInt(btn.getAttribute('data-ii'))
    };
  }
  checkSessionReady();
}

function checkSessionReady(){
  const label=freeSessionLabel||(document.getElementById('free-study-label')?.value.trim()||'');
  const ready=label&&freeSessionEndTime;
  const btn=document.getElementById('session-start-btn');
  if(btn){btn.disabled=!ready;btn.style.opacity=ready?'1':'0.5';}
}

function startFreeTimeSession(elOrKey,startT){
  const key=typeof elOrKey==='object'?elOrKey.getAttribute('data-key'):elOrKey;
  const customInp=document.getElementById('free-study-label');
  const label=freeSessionLabel||(customInp?.value.trim()||'勉強');
  if(!label||!freeSessionEndTime)return;
  
  const durationMins=Math.round((freeSessionEndTime-startT)*60);
  
  closeModal();
  
  // Add to study timer
  if(freeSessionStudyIdx.li>=0){
    timerActiveItem={
      listIdx:freeSessionStudyIdx.li,
      itemIdx:freeSessionStudyIdx.ii,
      isBreak:false,pomoCycle:1,breakMins:5,
      studyStartTime:new Date(),
      studyLabel:label,
      studyMins:durationMins
    };
  } else {
    timerActiveItem={
      listIdx:null,itemIdx:null,isBreak:false,pomoCycle:1,breakMins:5,
      studyStartTime:new Date(),
      studyLabel:label,studyMins:durationMins
    };
  }
  
  const notifyMins=parseInt(document.getElementById('notify-mins-sel')?.value||'5');
  timerRunning=true;
  timerPaused=false;
  timerSeconds=0;
  timerTotal=durationMins*60;
  if(timerActiveItem)timerActiveItem.notifyMins=notifyMins;
  timerInterval=setInterval(timerTick,1000);
  showOverlay('📚 '+label);
  
  // Also add task to day
  const startStr=timeToStr(startT);
  const endStr=timeToStr(freeSessionEndTime);
  if(!tasks[key])tasks[key]=[];
  tasks[key].push({id:'ft'+Date.now(),label,done:false,startTime:startStr,endTime:endStr,color:'#3A5FA0'});
  save();
  if(tab==='week')renderWeek();
  
  toast('🎯 '+label+' '+startStr+'〜'+endStr+' スタート！');
  freeSessionLabel='';freeSessionEndTime=null;freeSessionStudyIdx={li:-1,ii:-1};
}

function renderYearlyCalendar(){
  const months=[
    {y:2026,m:7,label:'2026年8月'},{y:2026,m:8,label:'2026年9月'},
    {y:2026,m:9,label:'2026年10月'},{y:2026,m:10,label:'2026年11月'},
    {y:2026,m:11,label:'2026年12月'},{y:2027,m:0,label:'2027年1月'},
    {y:2027,m:1,label:'2027年2月'},{y:2027,m:2,label:'2027年3月'},
    {y:2027,m:3,label:'2027年4月'},{y:2027,m:4,label:'2027年5月'},
  ];
  const DJ2=['日','月','火','水','木','金','土'];
  let html='';
  months.forEach(({y,m,label})=>{
    const first=new Date(y,m,1);
    const last=new Date(y,m+1,0);
    const today=dk(new Date());
    html+=`<div class="card" style="margin-bottom:12px;padding:10px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ac)">${label}</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px">`;
    DJ2.forEach(d=>html+=`<div style="text-align:center;color:var(--mu);padding:2px;font-weight:600">${d}</div>`);
    const startDow=first.getDay();
    for(let i=0;i<startDow;i++)html+=`<div></div>`;
    for(let day=1;day<=last.getDate();day++){
      const d=new Date(y,m,day);
      const k=dk(d);
      const isT=k===today;
      const uhEv=UH_CALENDAR[k]||'';
      const hasTasks=(tasks[k]||[]).length>0;
      html+=`<div style="text-align:center;padding:2px 1px;border-radius:4px;${isT?'background:var(--ac);color:white;font-weight:700':''}${uhEv?';background:#EBF3F8;color:#2D6A8F;font-weight:600':''}" title="${uhEv}">
        ${day}${uhEv?'<div style="font-size:7px;line-height:1;overflow:hidden">'+uhEv.slice(0,3)+'</div>':''}
      </div>`;
    }
    html+='</div>';

    // UH events this month
    const monthKey=`${y}-${String(m+1).padStart(2,'0')}`;
    const eventsThisMonth=Object.entries(UH_CALENDAR).filter(([k])=>k.startsWith(monthKey));
    if(eventsThisMonth.length>0){
      html+=`<div style="margin-top:8px;border-top:1px solid var(--bd);padding-top:6px">`;
      eventsThisMonth.forEach(([k,v])=>{
        const [ky,km,kd]=k.split('-').map(Number);const d=new Date(ky,km-1,kd);
        html+=`<div style="font-size:11px;color:var(--sub);margin-bottom:2px">${d.getMonth()+1}/${d.getDate()} ${v}</div>`;
      });
      html+='</div>';
    }
    html+='</div>';
  });
  return html;
}

function renderTodoList(){

    {key:'today',label:'📅 今日',color:'#E8856A'},
    {key:'week',label:'📆 今週',color:'#2D6A8F'},
    {key:'month',label:'🗓️ 今月',color:'#9B6AD4'},
    {key:'dream',label:'🌟 夢への一歩',color:'#5A8A6A'},
  ];
  
  let html='';
  cats.forEach(cat=>{
    // 今日カテゴリーはtasksから取得
    const items=cat.key==='today'?getTodayTasks():(todoLists[cat.key]||[]);
    const done=items.filter(t=>t.done).length;
    html+=`<div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:14px;font-weight:700;color:${cat.color}">${cat.label}</span>
        <span style="font-size:11px;color:var(--mu)">${done}/${items.length}</span>
        <div style="flex:1;height:4px;background:var(--bd);border-radius:2px;margin:0 4px">
          <div style="width:${items.length>0?Math.round(done/items.length*100):0}%;height:100%;background:${cat.color};border-radius:2px;transition:width .3s"></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:4px">`;
    
    // Show mandala cats as suggestions for dream
    if(cat.key==='dream'){
      const dreamSuggestions=[];
      (dreamData.dreams||[]).forEach(d=>{
        (d.cats||[]).forEach(c=>{
          (c.items||[]).filter(it=>!it.doneToday).forEach(it=>{
            dreamSuggestions.push({label:d.icon+' '+it.label,dreamId:d.id});
          });
        });
      });
      if(dreamSuggestions.length>0&&items.length===0){
        html+=`<div style="padding:8px 12px;font-size:11px;color:var(--mu)">曼陀羅チャートから追加できます：</div>`;
        dreamSuggestions.slice(0,4).forEach((s,si)=>{
          html+=`<div style="display:flex;align-items:center;padding:6px 12px;border-bottom:1px solid var(--bd)">
            <span style="flex:1;font-size:12px;color:var(--mu)">${s.label}</span>
            <button onclick="addTodoFromDream('${cat.key}','${s.label.replace(/'/g,"\'")}')" style="font-size:10px;padding:2px 8px;border-radius:6px;background:${cat.color}22;border:1px solid ${cat.color};color:${cat.color};cursor:pointer">追加</button>
          </div>`;
        });
      }
    }
    
    items.forEach((t,ti)=>{
      const isToday=cat.key==='today';
      const _tk=t._taskKey||'';
      const _tid=t.id||'';
      const checkFn=isToday?('toggleT(\''+_tk+'\',\''+_tid+'\')'):'toggleTodo(\''+cat.key+'\','+ti+')';
      const delFn=isToday?('delT(\''+_tk+'\',\''+_tid+'\')'):'deleteTodo(\''+cat.key+'\','+ti+')';
      html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd);${t.done?'opacity:0.5':''}">
        <button onclick="${checkFn};renderMemo()" style="width:20px;height:20px;border-radius:50%;border:2px solid ${t.done?cat.color:'var(--bd)'};background:${t.done?cat.color:'none'};cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center">
          ${t.done?'<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}
        </button>
        <span style="flex:1;font-size:13px;${t.done?'text-decoration:line-through':''}">${t.label}</span>
        ${t.movedFrom?`<span style="font-size:9px;padding:1px 5px;border-radius:8px;background:${cat.color}22;color:${cat.color}">${t.movedFrom}</span>`:''}
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          ${isToday?'':buildTodoMoveBtns(cat.key,ti)}
          ${isToday?('<button onclick="moveTodayToWeek(this)" data-id="'+t.id+'" style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;color:#2D6A8F">→今週</button>'):''}
          ${isToday?('<button onclick="moveTodayToMonth(this)" data-id="'+t.id+'" style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;color:#9B6AD4">→今月</button>'):''}
          <button onclick="${delFn};renderMemo()" style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;color:#DC2626">×</button>
        </div>
      </div>`;
    });
    
    if(items.filter(t=>!t.done).length===0&&items.length>0){
      html+=`<div style="padding:8px 12px;font-size:12px;color:#10B981;text-align:center">🎉 全部完了！</div>`;
    }
    
    html+=`<div style="padding:8px 12px;display:flex;gap:6px;border-top:1px solid var(--bd)">
      <input id="todo-inp-${cat.key}" placeholder="${cat.label}に追加..." style="flex:1;padding:6px 8px;border-radius:8px;border:1px solid var(--bd);font-size:12px;outline:none;background:var(--bg)" onkeydown="if(event.key==='Enter')addTodo('${cat.key}')">
      <button onclick="addTodo('${cat.key}')" class="abtn" style="padding:6px 10px;font-size:12px">追加</button>
    </div>`;
    html+=`</div></div>`;
  });
  return html;
}

function addTodo(cat){
  const inp=document.getElementById('todo-inp-'+cat);
  if(!inp||!inp.value.trim())return;
  if(cat==='today'){
    // Sync with main task store
    const key=dk(new Date());
    if(!tasks[key])tasks[key]=[];
    tasks[key].push({id:'td'+Date.now(),label:inp.value.trim(),done:false});
    save();
  } else {
    if(!todoLists[cat])todoLists[cat]=[];
    todoLists[cat].push({id:'td'+Date.now(),label:inp.value.trim(),done:false});
    saveTodos();
  }
  renderMemo();
}

function moveTodayToWeek(elOrId){
  const taskId=typeof elOrId==='string'?elOrId:elOrId.getAttribute('data-id');
  const key=dk(new Date());
  const t=(tasks[key]||[]).find(x=>x.id===taskId);
  if(!t)return;
  if(!todoLists.week)todoLists.week=[];
  todoLists.week.push({id:'td'+Date.now(),label:t.label,done:false,movedFrom:'今日'});
  saveTodos();
  renderMemo();
  toast('→今週に追加しました！');
}

function moveTodayToMonth(elOrId){
  const taskId=typeof elOrId==='string'?elOrId:elOrId.getAttribute('data-id');
  const key=dk(new Date());
  const t=(tasks[key]||[]).find(x=>x.id===taskId);
  if(!t)return;
  if(!todoLists.month)todoLists.month=[];
  todoLists.month.push({id:'td'+Date.now(),label:t.label,done:false,movedFrom:'今日'});
  saveTodos();
  renderMemo();
  toast('→今月に追加しました！');
}

function addTodoFromDream(cat,label){
  if(!todoLists[cat])todoLists[cat]=[];
  todoLists[cat].push({id:'td'+Date.now(),label,done:false,movedFrom:'夢'});
  saveTodos();
  renderMemo();
}

function buildTodoMoveBtns(fromCat,idx){
  const cats=[
    {key:'today',label:'今日',color:'#E8856A'},
    {key:'week',label:'今週',color:'#2D6A8F'},
    {key:'month',label:'今月',color:'#9B6AD4'},
    {key:'dream',label:'夢',color:'#5A8A6A'},
  ];
  return cats
    .filter(c=>c.key!==fromCat)
    .map(c=>'<button onclick="moveTodo(this)" data-from="'+fromCat+'" data-idx="'+idx+'" data-to="'+c.key+'" style="font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--bd);cursor:pointer;color:'+c.color+'">→'+c.label+'</button>')
    .join('');
}

function toggleTodo(cat,idx){
  if(!todoLists[cat])return;
  todoLists[cat][idx].done=!todoLists[cat][idx].done;
  if(todoLists[cat][idx].done)playPing();
  saveTodos();
  renderMemo();
}

function deleteTodo(cat,idx){
  if(!todoLists[cat])return;
  todoLists[cat].splice(idx,1);
  saveTodos();
  renderMemo();
}

function moveTodo(elOrFrom,idx,toCat){
  let fromCat=elOrFrom;
  if(typeof elOrFrom==='object'){
    fromCat=elOrFrom.getAttribute('data-from');
    idx=parseInt(elOrFrom.getAttribute('data-idx'));
    toCat=elOrFrom.getAttribute('data-to');
  }
  const labels={today:'今日',week:'今週',month:'今月',dream:'夢'};
  if(!todoLists[fromCat])return;
  const [item]=todoLists[fromCat].splice(idx,1);
  item.movedFrom=labels[fromCat]||fromCat;
  item.done=false;
  if(toCat==='today'){
    // Move to main task store
    const key=dk(new Date());
    if(!tasks[key])tasks[key]=[];
    tasks[key].push({id:'td'+Date.now(),label:item.label,done:false,movedFrom:item.movedFrom});
    save();
  } else {
    if(!todoLists[toCat])todoLists[toCat]=[];
    todoLists[toCat].push(item);
  }
  saveTodos();
  renderMemo();
  toast('→ '+labels[toCat]+'に移動しました！');
}

    });
    html+=`<button onclick="clearDoneShop()" style="width:100%;padding:8px;background:none;border:none;color:var(--mu);font-size:12px;cursor:pointer;border-top:1px solid var(--bd)">購入済みをクリア</button>`;

function addShop(){

function deleteShop(i){

// ===== 集中モード =====
let focusInterval=null;
let focusSeconds=0;
let focusTotal=25*60;
let focusPaused=false;
let focusKey=null;
let focusIsBreak=false;
let noiseNode=null;
let noiseCtx=null;
let currentNoise='none';
let strictMode=false;

function startFocusMode(key){
  focusKey=key;
  const urgentTasks=(tasks[key]||[]).filter(t=>t.urgent&&!t.done);
  const pendingAll=(tasks[key]||[]).filter(t=>!t.done);
  const label=urgentTasks.length>0?urgentTasks[0].label:(pendingAll.length>0?pendingAll[0].label:'集中モード');
  
  // Ask duration
  const mins=parseInt(prompt('集中時間（分）:', '25'))||25;
  focusTotal=mins*60;
  focusSeconds=0;
  focusPaused=false;
  
  // Build task list display
  const urgentList=urgentTasks.length>0?urgentTasks:pendingAll.slice(0,3);
  let taskListHtml='';
  urgentList.forEach(t=>{
    taskListHtml+='<div style="padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.1);margin-bottom:6px;font-size:13px;display:flex;align-items:center;gap:8px">'+
      '<div style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.6);flex-shrink:0"></div>'+t.label+'</div>';
  });
  document.getElementById('focus-label').textContent=label;
  document.getElementById('focus-task-list').innerHTML=taskListHtml;
  document.getElementById('focus-overlay').style.display='flex';
  document.getElementById('focus-mode-label').textContent='集中中';
  document.getElementById('focus-timer-display').style.color='white';
  // Reset noise buttons
  document.querySelectorAll('[id^=noise-]').forEach(b=>b.style.background='rgba(255,255,255,0.1)');
  document.getElementById('noise-none').style.background='rgba(255,255,255,0.35)';
  applyStrictMode(true);
  updateFocusDisplay();
  
  focusInterval=setInterval(()=>{
    if(focusPaused)return;
    focusSeconds++;
    updateFocusDisplay();
    if(focusSeconds>=focusTotal){
      clearInterval(focusInterval);
      exitFocusMode();
      playTimerEnd();
      toast('🎯 集中セッション完了！お疲れ様でした！');
    }
  },1000);
}

function updateFocusDisplay(){
  const remaining=focusTotal-focusSeconds;
  const m=Math.floor(remaining/60);
  const s=remaining%60;
  const el=document.getElementById('focus-timer-display');
  if(el)el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function toggleFocusPause(){
  focusPaused=!focusPaused;
  const btn=document.getElementById('focus-pause-btn');
  if(btn)btn.textContent=focusPaused?'▶ 再開':'⏸ 一時停止';
}

function exitFocusMode(){
  clearInterval(focusInterval);
  focusInterval=null;
  stopNoise();
  currentNoise='none';
  applyStrictMode(false);
  document.getElementById('focus-overlay').style.display='none';
  render();
}

// ===== White Noise =====
function toggleNoise(type){
  currentNoise=type;
  document.querySelectorAll('[id^=noise-]').forEach(b=>{
    b.style.background=b.id==='noise-'+type?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.1)';
  });
  stopNoise();
  if(type==='none')return;
  startNoise(type);
}

function stopNoise(){
  if(noiseNode){try{noiseNode.stop();}catch(e){}noiseNode=null;}
  if(noiseCtx){try{noiseCtx.close();}catch(e){}noiseCtx=null;}
}

function startNoise(type){
  try{
    noiseCtx=new(window.AudioContext||window.webkitAudioContext)();
    const bufferSize=noiseCtx.sampleRate*4;
    const buffer=noiseCtx.createBuffer(1,bufferSize,noiseCtx.sampleRate);
    const data=buffer.getChannelData(0);
    
    if(type==='white'){
      for(let i=0;i<bufferSize;i++)data[i]=(Math.random()*2-1)*0.15;
    } else if(type==='rain'){
      // Rain: filtered white noise with low frequency bursts
      for(let i=0;i<bufferSize;i++){
        data[i]=(Math.random()*2-1)*0.1;
        if(Math.random()<0.003)data[i]+=Math.random()*0.3;
      }
    } else if(type==='wave'){
      // Ocean waves: sine wave modulated noise
      for(let i=0;i<bufferSize;i++){
        const wave=Math.sin(i*0.0001)*0.5+0.5;
        data[i]=(Math.random()*2-1)*wave*0.15;
      }
    } else if(type==='cafe'){
      // Cafe: mid-frequency rumble
      for(let i=0;i<bufferSize;i++){
        data[i]=(Math.random()*2-1)*0.08;
        if(i>0)data[i]=data[i]*0.3+data[i-1]*0.7;
      }
    }
    
    noiseNode=noiseCtx.createBufferSource();
    noiseNode.buffer=buffer;
    noiseNode.loop=true;
    const gain=noiseCtx.createGain();
    gain.gain.value=0.4;
    noiseNode.connect(gain);
    gain.connect(noiseCtx.destination);
    noiseNode.start();
  }catch(e){console.log('Noise error:',e);}
}

// ===== 休憩モード =====
function startFocusBreak(){
  const mins=parseInt(prompt('休憩時間（分）:','5'))||5;
  focusPaused=false;
  focusIsBreak=true;
  focusSeconds=0;
  focusTotal=mins*60;
  clearInterval(focusInterval);
  const modeLabel=document.getElementById('focus-mode-label');
  if(modeLabel)modeLabel.textContent='☕ 休憩中 '+mins+'分';
  const pauseBtn=document.getElementById('focus-pause-btn');
  if(pauseBtn)pauseBtn.style.display='none';
  document.getElementById('focus-timer-display').style.color='#10B981';
  focusInterval=setInterval(()=>{
    focusSeconds++;
    updateFocusDisplay();
    if(focusSeconds>=focusTotal){
      clearInterval(focusInterval);
      focusIsBreak=false;
      playTimerEnd();
      // Restart focus
      const modeEl=document.getElementById('focus-mode-label');
      if(modeEl)modeEl.textContent='集中中';
      const timerEl=document.getElementById('focus-timer-display');
      if(timerEl)timerEl.style.color='white';
      const pb=document.getElementById('focus-pause-btn');
      if(pb)pb.style.display='';
      toast('☕ 休憩終了！集中再開🎯');
      // Restart focus timer
      focusSeconds=0;
      focusTotal=25*60;
      focusPaused=false;
      focusInterval=setInterval(()=>{
        if(!focusPaused)focusSeconds++;
        updateFocusDisplay();
        if(focusSeconds>=focusTotal){
          clearInterval(focusInterval);
          exitFocusMode();
          playTimerEnd();
          toast('🎯 集中セッション完了！お疲れ様でした！');
        }
      },1000);
    }
  },1000);
}

// ===== Strict Mode =====
function applyStrictMode(active){
  strictMode=active;
  const navBtns=document.querySelectorAll('.nav button');
  navBtns.forEach(btn=>{
    const t=btn.getAttribute('onclick')?.match(/sw\('(\w+)'\)/)?.[1];
    if(t&&t!=='today'){
      btn.style.opacity=active?'0.2':'';
      btn.style.pointerEvents=active?'none':'';
    }
  });
}

function toggleUrgent(key,id){
  const t=(tasks[key]||[]).find(x=>x.id===id);
  if(t){t.urgent=!t.urgent;save();render();}
}

function playPing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    // Cute completion sound: two tones
    [[880,0,0.15],[1108,0.1,0.2]].forEach(([freq,delay,dur])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(0.25,ctx.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+dur);
      o.start(ctx.currentTime+delay);
      o.stop(ctx.currentTime+delay+dur+0.05);
    });
  }catch(e){}
}

function playTimerEnd(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    // Cheerful 4-note ascending melody
    [[523,0],[659,0.18],[784,0.36],[1047,0.54]].forEach(([freq,delay])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=freq;o.type='sine';
      g.gain.setValueAtTime(0,ctx.currentTime+delay);
      g.gain.linearRampToValueAtTime(0.28,ctx.currentTime+delay+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+0.35);
      o.start(ctx.currentTime+delay);
      o.stop(ctx.currentTime+delay+0.4);
    });
  }catch(e){}
}

function timeToStr(t){
  const h=Math.floor(t),m=Math.round((t%1)*60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function strToTime(s){
  const [h,m]=s.split(':').map(Number);
  return h+(m/60);
}

function schToggleDay(si,di,checked){
  if(checked){if(!schedule[si].days.includes(di))schedule[si].days.push(di);schedule[si].days.sort();}
  else schedule[si].days=schedule[si].days.filter(d=>d!==di);
  save();
}

function addSchItem(){
  schedule.push({id:'s'+Date.now(),start:9,end:10,label:'新しい予定',color:'#2D6A8F',bg:'#EBF3F8',days:[1,2,3,4,5]});
  save();openSchEdit();
}

        const tasksStart=(tasks[k]||[]).filter(x=>!x.done&&x.startTime&&strToTime(x.startTime)>=t&&strToTime(x.startTime)<slotEnd);
        // Tasks spanning this slot (start before, end after)
        const tasksSpan=(tasks[k]||[]).filter(x=>!x.done&&x.startTime&&x.endTime&&strToTime(x.startTime)<t&&strToTime(x.endTime)>t);
        
        // Calculate height for tasks with duration
        const slotH=28; // px per 30min slot
        
        h+=`<div onclick="openTimeSlot('${k}',${t})" style="cursor:pointer;padding:1px;min-height:${slotH}px;border-top:${borderStyle};border-left:1px solid #F3F0EB;position:relative">`;
        
        evs.forEach(e=>{
          const isStart=e.start>=t&&e.start<slotEnd;
          if(isStart){
            const dur=e.end-e.start; // in hours
            const heightPx=Math.max(Math.round(dur*slotH*2)-4,24);
            h+=`<div class="wgev" onclick="event.stopPropagation();openSchItemModal('${e.id}','${k}')" style="background:${e.bg};border-left:3px solid ${e.color};color:${e.color};font-size:9px;padding:3px 4px;border-radius:4px;margin:1px 0;overflow:hidden;cursor:pointer;height:${heightPx-4}px;position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-start">
              <div style="font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${e.label}</div>
              <div style="opacity:0.7;font-size:8px">${timeToStr(e.start)}〜${timeToStr(e.end)}</div>
            </div>`;
          } else if(e.start<t&&e.end>t){
            // Continuation cell - invisible spacer to prevent other content overlapping
            h+=`<div style="height:${slotH-2}px;opacity:0"></div>`;
          }
        });
        
        // Tasks starting here - show with full height if end time given
        tasksStart.forEach(tk=>{
          const taskColor=tk.color||'#10B981';
          const taskBg=tk.color?(tk.color+'18'):'#F0FDF4';
          const taskText=tk.color||'#065F46';
          if(tk.endTime){
            const dur=strToTime(tk.endTime)-strToTime(tk.startTime);
            const heightPx=Math.max(Math.round(dur*slotH*2),24);
            h+=`<div onclick="event.stopPropagation();openDayModal('${k}')" style="background:${taskBg};border-left:3px solid ${taskColor};font-size:9px;padding:3px 4px;border-radius:3px;margin:1px 0;color:${taskText};cursor:pointer;height:${heightPx}px;overflow:hidden;position:relative;z-index:2">
              <div style="font-weight:600">📝 ${tk.label}</div>
              <div style="opacity:0.7">${tk.startTime}〜${tk.endTime}</div>
            </div>`;
          } else {
            // No end time - small indicator
            h+=`<div onclick="event.stopPropagation();openDayModal('${k}')" style="background:${taskBg};border-left:3px solid ${taskColor};font-size:9px;padding:2px 4px;border-radius:3px;margin:1px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:${taskText};cursor:pointer">📝 ${tk.label}</div>`;
          }
        });
        
        // Tasks spanning this slot (continuation)
        tasksSpan.forEach(tk=>{
          const taskColor=tk.color||'#10B981';
          const taskBg=tk.color?(tk.color+'10'):'#F0FDF422';
          h+=`<div style="background:${taskBg};border-left:3px solid ${taskColor};height:${slotH-2}px;opacity:0.4;border-radius:2px;margin:1px 0"></div>`;
        });
        
        // Study blocks
        (studyBlocks[k]||[]).filter(sb=>sb.startH>=t&&sb.startH<slotEnd).forEach(sb=>{
          const dur=sb.endH-sb.startH;
          const heightPx=Math.max(Math.round(dur*slotH*2),20);
          h+=`<div style="background:#EBF3F8;border-left:2px solid #3A5FA0;color:#2D6A8F;font-size:8px;padding:2px 3px;border-radius:2px;margin:1px 0;overflow:hidden;height:${heightPx}px;position:relative;z-index:2">📚 ${sb.label}<span style="opacity:0.7;float:right">${timeToStr(sb.startH)}</span></div>`;
        });
        
        h+=`</div>`;
      });
    }
  }
  h+=`</div></div>`;
  document.getElementById('view-week').innerHTML=h;
}

function startHabitTimer(hid,key,mins){
  if(timerRunning)stopTimer();
  timerActiveItem={habitId:hid,habitKey:key};
  timerRunning=true;
  timerPaused=false;
  timerSeconds=0;
  timerTotal=mins*60;
  const hb=habits.find(h=>h.id===hid);
  showOverlay((hb?hb.icon+' '+hb.name:'🧘 瞑想中'));
  timerInterval=setInterval(()=>{
    timerSeconds++;
    updateTimerDisplay();
    updateOverlay();
    // Notify before end
  const notifyAt=timerActiveItem?.notifyMins?timerTotal-(timerActiveItem.notifyMins*60):-1;
  if(notifyAt>0&&timerSeconds===notifyAt){
    playPing();
    toast('⏰ あと'+(timerActiveItem?.notifyMins||5)+'分で終了します！');
  }
  if(timerSeconds>=timerTotal){
      clearInterval(timerInterval);
      timerRunning=false;
      hideOverlay();
      // Mark habit as done
      if(!data[key])data[key]={};
      data[key][hid]=true;
      playTimerEnd();
      toast('⏰ '+(hb?hb.name:'習慣')+'完了！✅');
      save();
      render();
    }
  },1000);
}

function toggleRecurringDay(i,d,checked){
  if(checked){if(!recurringTasks[i].days.includes(d))recurringTasks[i].days.push(d);recurringTasks[i].days.sort();}
  else recurringTasks[i].days=recurringTasks[i].days.filter(x=>x!==d);
  save();recurringApplied=false;applyRecurringTasks();render();
}

function deleteRecurring(i){
  if(!confirm('削除しますか？'))return;
  const id=recurringTasks[i].id;
  recurringTasks.splice(i,1);
  // 未完了の繰り返しタスクを削除
  Object.keys(tasks).forEach(k=>{
    tasks[k]=tasks[k].filter(t=>t.recurringId!==id);
  });
  save();render();
}

const ANIMALS=['🐦','🦋','🐿️','🦜','🐇','🦔','🐝','🦚'];

function getTreeProgress(){
  try {
    const dates=getWk();
    let score=0;
    (dreamData.dreams||[]).forEach(dream=>{
      (dream.cats||[]).forEach(cat=>{
        const pct=getMandalaProgress(cat);
        score+=Math.round(pct*5);
      });
    });
    if(typeof habits!=='undefined'){
      dates.forEach(d=>{
        const k=dk(d);
        habits.forEach(h=>{if(data[k]&&data[k][h.id])score+=0.5;});
      });
    }
    return Math.min(Math.round(score),60);
  } catch(e){ return 0; }
}

function drawTree(progress){
  const pct=progress/60;
  const now=new Date();
  const monthIdx=now.getMonth();
  const flower=FLOWERS[monthIdx%FLOWERS.length];
  const animal=ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
  const leafCount=Math.floor(pct*12);
  const trunkH=60+pct*40;
  const branches=pct>0.2;
  const hasFlowers=pct>0.5;
  const hasAnimal=pct>0.3;
  const hasApples=pct>0.8;

  // Generate leaf positions
  const leaves=[];
  for(let i=0;i<leafCount;i++){
    const angle=(i/leafCount)*Math.PI*2;
    const r=30+Math.random()*25;
    const x=160+Math.cos(angle)*r;
    const y=120-Math.sin(angle)*r*0.7;
    leaves.push({x,y,r:8+Math.random()*6});
  }

  let svg=`<svg class="tree-svg" viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg">
    <!-- Sky background -->
    <defs>
      <radialGradient id="sunGrad" cx="80%" cy="20%">
        <stop offset="0%" stop-color="#FFE066" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="320" height="280" fill="transparent"/>
    <!-- Sun -->
    <circle cx="260" cy="40" r="25" fill="url(#sunGrad)"/>
    <circle cx="260" cy="40" r="16" fill="#FFE066" opacity="0.9"/>
    <!-- Ground -->
    <ellipse cx="160" cy="260" rx="80" ry="12" fill="#5A8A5A" opacity="0.5"/>
    <!-- Trunk -->
    <rect x="152" y="${220-trunkH}" width="16" height="${trunkH}" rx="4" fill="#8B6914"/>`;

  if(branches&&pct>0.2){
    const bh=220-trunkH+20;
    svg+=`<line x1="160" y1="${bh}" x2="${120+pct*20}" y2="${bh-30}" stroke="#8B6914" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="${bh+10}" x2="${195-pct*10}" y2="${bh-20}" stroke="#8B6914" stroke-width="5" stroke-linecap="round"/>`;
  }

  // Leaves (canopy)
  if(pct>0.1){
    const canopyY=155-pct*30;
    const canopyR=40+pct*35;
    svg+=`<ellipse cx="160" cy="${canopyY}" rx="${canopyR}" ry="${canopyR*0.8}" fill="#4CAF50" opacity="0.85"/>`;
    svg+=`<ellipse cx="${140-pct*5}" cy="${canopyY+10}" rx="${canopyR*0.7}" ry="${canopyR*0.6}" fill="#66BB6A" opacity="0.6"/>`;
    svg+=`<ellipse cx="${175+pct*5}" cy="${canopyY+15}" rx="${canopyR*0.65}" ry="${canopyR*0.55}" fill="#388E3C" opacity="0.5"/>`;
  }

  // Flowers/fruits
  if(hasFlowers){
    const positions=[[140,130],[175,125],[155,115],[185,140],[130,145]];
    positions.slice(0,Math.floor(pct*5)).forEach(([x,y])=>{
      svg+=`<text x="${x}" y="${y}" font-size="14" text-anchor="middle">${flower}</text>`;
    });
  }

  // Apples/fruits
  if(hasApples){
    svg+=`<text x="145" y="155" font-size="12">🍎</text>`;
    svg+=`<text x="170" y="160" font-size="12">🍎</text>`;
  }

  // Animal
  if(hasAnimal){
    svg+=`<text x="220" y="180" font-size="20">${animal}</text>`;
  }

  // Progress label
  svg+=`<text x="160" y="272" text-anchor="middle" font-size="10" fill="#fff" opacity="0.8">成長スコア: ${progress}/60 🌱</text>`;

  svg+='</svg>';
  return svg;
}

function toggleDreamLink(dreamIdx,type,id){
  const dream=dreamData.dreams[dreamIdx];
  if(type==='habit'){
    if(!dream.linkedHabits)dream.linkedHabits=[];
    const idx=dream.linkedHabits.indexOf(id);
    if(idx>=0)dream.linkedHabits.splice(idx,1);
    else dream.linkedHabits.push(id);
  } else {
    if(!dream.linkedStudy)dream.linkedStudy=[];
    const idx=dream.linkedStudy.indexOf(id);
    if(idx>=0)dream.linkedStudy.splice(idx,1);
    else dream.linkedStudy.push(id);
  }
  saveDream();
  renderDream();
}

function getDreamWater(dream){
  try {
    let score=0;
    let total=0;
    // Mandala cats
    const cats=dream.cats||[];
    cats.forEach(cat=>{score+=getMandalaProgress(cat);total++;});
    // Linked habits
    const today=dk(new Date());
    (dream.linkedHabits||[]).forEach(hid=>{
      total++;
      if(data[today]&&data[today][hid])score++;
    });
    // Linked study
    (dream.linkedStudy||[]).forEach(sid=>{
      const sl=studyLists.find(s=>s.id===sid);
      if(sl){
        const done=sl.items.filter(i=>i.done).length;
        const tot=sl.items.length;
        if(tot>0){score+=done/tot;total++;}
      }
    });
    return total>0?Math.min(score/total,1):0;
  } catch(e){return 0;}
}

    color:colors[idx%colors.length],
    water:0,
    cats:[]
  });
  saveDream();
  renderDream();
}

function getMandalaProgress(cat){
  try {
    const items=cat.items||[];
    if(items.length===0)return 0;
    const itemDone=items.filter(i=>i.doneToday).length/items.length;
    let syncScore=0;
    if(cat.syncType==='habit'&&typeof habits!=='undefined'&&habits.length>0){
      const today=dk(new Date());
      const total=habits.length;
      const done=habits.filter(h=>data[today]&&data[today][h.id]).length;
      syncScore=total>0?done/total:0;
    } else if(cat.syncType==='study'&&typeof studyLists!=='undefined'){
      const ids=cat.syncIds||[];
      const lists=ids.length>0?studyLists.filter(sl=>ids.includes(sl.id)):studyLists;
      let done=0,total=0;
      lists.forEach(sl=>{
        total+=(sl.items||[]).length;
        done+=(sl.items||[]).filter(i=>i.done).length;
      });
      syncScore=total>0?done/total:0;
    }
    return Math.min((itemDone+syncScore)/2*1.5,1);
  } catch(e){ return 0; }
}

function getMandalaSync(cat){
  try {
    if(cat.syncType==='habit'&&typeof habits!=='undefined'){
      const today=dk(new Date());
      const done=habits.filter(h=>data[today]&&data[today][h.id]).length;
      return `習慣 ${done}/${habits.length}`;
    } else if(cat.syncType==='study'&&typeof studyLists!=='undefined'){
      const ids=cat.syncIds||[];
      const lists=ids.length>0?studyLists.filter(sl=>ids.includes(sl.id)):studyLists;
      let done=0,total=0;
      lists.forEach(sl=>{
        total+=(sl.items||[]).length;
        done+=(sl.items||[]).filter(i=>i.done).length;
      });
      return `学習 ${done}/${total}`;
    }
    return '';
  } catch(e){ return ''; }
}

let habitDragIdx=null;
let setHabitDragIdx=null;
let touchSortIdx=null;
let touchSortEl=null;
let touchSortClone=null;

function setHabitDragStart(e,i){
  setHabitDragIdx=i;
  e.dataTransfer.effectAllowed='move';
}
function setHabitDragOver(e,i){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  document.querySelectorAll('[id^=set-hrow-]').forEach(r=>r.style.outline='');
  const el=document.getElementById('set-hrow-'+i);
  if(el)el.style.outline='2px solid var(--ac)';
}
function setHabitDrop(e,i){
  e.preventDefault();
  if(setHabitDragIdx===null||setHabitDragIdx===i)return;
  const [moved]=habits.splice(setHabitDragIdx,1);
  habits.splice(i,0,moved);
  save();render();
}
function setHabitDragEnd(){
  setHabitDragIdx=null;
  document.querySelectorAll('[id^=set-hrow-]').forEach(r=>r.style.outline='');
}

function touchSortStart(e,i){
  e.stopPropagation();
  touchSortIdx=i;
  touchSortEl=document.getElementById('set-hrow-'+i);
  if(touchSortEl){
    touchSortEl.style.opacity='0.5';
    touchSortEl.style.outline='2px solid var(--ac)';
  }
}
function touchSortMove(e){
  if(touchSortIdx===null)return;
  e.preventDefault();
  const touch=e.touches[0];
  document.querySelectorAll('[id^=set-hrow-]').forEach(el=>{
    const rect=el.getBoundingClientRect();
    const idx=parseInt(el.getAttribute('data-idx'));
    if(touch.clientY>=rect.top&&touch.clientY<=rect.bottom&&idx!==touchSortIdx){
      document.querySelectorAll('[id^=set-hrow-]').forEach(r=>{
        if(r!==touchSortEl)r.style.outline='';
      });
      el.style.outline='2px solid var(--ac)';
    }
  });
}
function touchSortEnd(e){
  if(touchSortIdx===null)return;
  const touch=e.changedTouches[0];
  let dropIdx=null;
  document.querySelectorAll('[id^=set-hrow-]').forEach(el=>{
    const rect=el.getBoundingClientRect();
    const idx=parseInt(el.getAttribute('data-idx'));
    if(touch.clientY>=rect.top&&touch.clientY<=rect.bottom&&idx!==touchSortIdx){
      dropIdx=idx;
    }
    el.style.outline='';
    el.style.opacity='';
  });
  if(dropIdx!==null){
    const [moved]=habits.splice(touchSortIdx,1);
    habits.splice(dropIdx,0,moved);
    save();render();
  }
  touchSortIdx=null;touchSortEl=null;
}
function habitDragStart(i){habitDragIdx=i;}
function habitDragOver(e,i){e.preventDefault();document.querySelectorAll('.hrow').forEach(r=>r.style.background='');const el=document.getElementById('hrow-'+i);if(el)el.style.background='var(--bg)';}
function habitDrop(i){
  if(habitDragIdx===null||habitDragIdx===i)return;
  const [moved]=habits.splice(habitDragIdx,1);
  habits.splice(i,0,moved);
  save();render();
}
function habitDragEnd(){habitDragIdx=null;document.querySelectorAll('.hrow').forEach(r=>r.style.background='');}

let studyNoiseNode=null;
let studyNoiseCtx=null;

function toggleStudyNoise(type){
  // Stop existing
  if(studyNoiseNode){try{studyNoiseNode.stop();}catch(e){}studyNoiseNode=null;}
  if(studyNoiseCtx){try{studyNoiseCtx.close();}catch(e){}studyNoiseCtx=null;}
  // Update buttons
  ['none','rain','cafe','wave'].forEach(t=>{
    const b=document.getElementById('snoise-'+t);
    if(b){b.style.background=t===type?'var(--ac)':'var(--bg)';b.style.color=t===type?'white':'var(--tx)';b.style.border=t===type?'none':'1px solid var(--bd)';}
  });
  if(type==='none')return;
  try{
    studyNoiseCtx=new(window.AudioContext||window.webkitAudioContext)();
    const sr=studyNoiseCtx.sampleRate;
    const buf=studyNoiseCtx.createBuffer(1,sr*4,sr);
    const d=buf.getChannelData(0);
    if(type==='rain'){for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*0.1;if(Math.random()<0.003)d[i]+=Math.random()*0.25;}}
    else if(type==='cafe'){for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*0.07;if(i>0)d[i]=d[i]*0.3+d[i-1]*0.7;}}
    else if(type==='wave'){for(let i=0;i<d.length;i++){const w=Math.sin(i*0.0001)*0.5+0.5;d[i]=(Math.random()*2-1)*w*0.12;}}
    studyNoiseNode=studyNoiseCtx.createBufferSource();
    studyNoiseNode.buffer=buf;studyNoiseNode.loop=true;
    const g=studyNoiseCtx.createGain();g.gain.value=0.4;
    studyNoiseNode.connect(g);g.connect(studyNoiseCtx.destination);
    studyNoiseNode.start();
  }catch(e){}
}

  if(timerRunning)stopTimer();

  if(timerActiveItem&&timerActiveItem.studyStartTime&&!timerActiveItem.isBreak&&timerSeconds>60){

    const key=dk(startT);

    studyBlocks[key].push({
      id:'sb'+Date.now(),
      label:timerActiveItem.studyLabel||'学習',
      startH:startT.getHours()+(startT.getMinutes()/60),
      endH:endT.getHours()+(endT.getMinutes()/60),
      color:'#3A5FA0',
    });
    saveStudy();
  }
  timerRunning=false;
  timerPaused=false;

          '<input id="break-mins" type="number" value="5" min="1" max="30" style="width:50px;padding:6px;border-radius:8px;border:1px solid var(--bd);font-size:14px;text-align:center;outline:none">'+
          '<label style="font-size:12px;color:var(--mu)">分</label>'+
          '</div>'
      }
    </div>
  </div>`;

  // チェックリスト
  html+=`<div class="sec"><span>今週のチェックリスト</span><span class="sec-edit" onclick="studyOpenList='edit';renderStudy()">編集</span></div>`;

  if(studyOpenList==='edit'){
    html+=`<div style="margin-bottom:8px"><button onclick="studyOpenList=null;renderStudy()" style="padding:6px 12px;border-radius:8px;background:var(--sur);border:1px solid var(--bd);font-size:12px;cursor:pointer">← 戻る</button></div>`;
    studyLists.forEach((sl,li)=>{
      html+=`<div class="card" style="margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)">
          <div style="width:10px;height:10px;border-radius:50%;background:${sl.color};flex-shrink:0"></div>
          <input value="${sl.name}" onchange="studyLists[${li}].name=this.value;saveStudy()" style="flex:1;font-size:13px;font-weight:600;border:none;background:transparent;outline:none;color:var(--tx)">
          <button class="delbtn" onclick="studyLists.splice(${li},1);saveStudy();renderStudy()">×</button>
        </div>
        ${sl.items.map((item,ii)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)">
          <input value="${item.label}" onchange="studyLists[${li}].items[${ii}].label=this.value;saveStudy()" style="flex:1;font-size:12px;border:none;background:transparent;outline:none;color:var(--tx)">
          <button class="delbtn" style="width:22px;height:22px;font-size:11px" onclick="studyLists[${li}].items.splice(${ii},1);saveStudy();renderStudy()">×</button>
        </div>`).join('')}
        <div style="padding:8px 12px;display:flex;gap:6px">
          <input id="new-item-${li}" placeholder="項目を追加" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--bd);font-size:12px;outline:none;background:var(--bg)">
          <button class="abtn" style="font-size:12px;padding:6px 10px" onclick="addStudyItem(${li})">追加</button>
        </div>
      </div>`;
    });
    html+=`<div style="display:flex;gap:6px;margin-top:8px">
      <input id="new-list-name" placeholder="新しい科目を追加" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)">
      <button class="abtn" onclick="addStudyList()">追加</button>
    </div>`;
  } else {
    studyLists.forEach((sl,li)=>{
      const done=sl.items.filter(i=>i.done).length;
      const total=sl.items.length;
      html+=`<div class="card" style="margin-bottom:8px">
        <div style="padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px">
          <div style="width:10px;height:10px;border-radius:50%;background:${sl.color};flex-shrink:0"></div>
          <span style="font-size:13px;font-weight:600;flex:1">${sl.name}</span>
          <span style="font-size:11px;color:var(--mu)">${done}/${total}</span>
        </div>
        ${sl.items.map((item,ii)=>`
        <div class="study-item">
          <button class="study-check${item.done?' done':''}" onclick="toggleStudyItem(${li},${ii})" aria-label="${item.label}">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <span style="flex:1;font-size:13px;${item.done?'text-decoration:line-through;color:var(--mu)':''}">${item.label}</span>
          ${!timerRunning?('<button onclick="startTimer('+li+','+ii+')" style="padding:4px 8px;border-radius:6px;background:'+sl.color+'22;border:1px solid '+sl.color+';color:'+sl.color+';font-size:11px;cursor:pointer">▶ 開始</button>'):''}
        </div>`).join('')}
      </div>`;
    });
  }

  document.getElementById('view-study').innerHTML=html;
}

function toggleStudyItem(li,ii){
  studyLists[li].items[ii].done=!studyLists[li].items[ii].done;
  if(studyLists[li].items[ii].done)playPing();
  saveStudy();
  renderStudy();
}

function addStudyItem(li){
  const inp=document.getElementById('new-item-'+li);
  if(!inp||!inp.value.trim())return;
  studyLists[li].items.push({id:'i'+Date.now(),label:inp.value.trim(),done:false});
  saveStudy();
  renderStudy();
}

function addStudyList(){
  const inp=document.getElementById('new-list-name');
  if(!inp||!inp.value.trim())return;
  const colors=['#2D6A8F','#6A3A8F','#1A2E3A','#9B6AD4','#E8856A','#5A8A6A'];
  studyLists.push({id:'sl'+Date.now(),name:inp.value.trim(),color:colors[studyLists.length%colors.length],items:[]});
  saveStudy();
  renderStudy();
}

checkWeeklyReset();

render();
</script>
</body>
</html>
