<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yuka's Planner</title>
<style>
:root{--bg:#F7F4EF;--sur:#FFF;--bd:#E8E2D9;--tx:#1A2030;--sub:#6B7280;--mu:#9CA3AF;--ac:#2D6A8F;--r:10px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:0 auto}
.app{padding:0 0 80px}
header{padding:18px 16px 8px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:22px;height:22px;fill:none;stroke:white;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ht h1{font-size:17px;font-weight:700}
.ht p{font-size:11px;color:var(--sub);font-style:italic}
.si{margin-left:auto;font-size:10px;color:var(--mu);display:flex;align-items:center;gap:4px;transition:opacity .3s}
.sd{width:6px;height:6px;border-radius:50%;background:#10B981}
.nav{display:flex;background:var(--sur);border-top:1px solid var(--bd);position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:10px 4px 12px;background:none;border:none;font-size:10px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nav button.active{color:var(--ac)}
.ni svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.view{display:none;padding:0 16px}
.view.active{display:block}
.card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:12px;overflow:hidden}
.sec{font-size:11px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;display:flex;align-items:center;justify-content:space-between}
.sec-edit{font-size:11px;color:var(--ac);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.dnav{display:flex;align-items:center;gap:10px;padding:10px 0}
.dnav button{width:32px;height:32px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dtitle{flex:1;font-size:16px;font-weight:700}
.dsub{font-size:12px;color:var(--sub);font-weight:400}
.tlr{display:grid;grid-template-columns:42px 1fr}
.tt{font-size:10px;color:var(--mu);text-align:right;padding:10px 8px 0 0}
.tc{border-left:1px solid var(--bd);padding:5px 0 5px 8px;min-height:46px}
.tc.hb{border-top:1px solid var(--bd)}
.ev{padding:5px 8px;margin-bottom:3px;font-size:12px;font-weight:500;border-left:3px solid;line-height:1.3}
.hrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.hrow:last-child{border-bottom:none}
.hic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.hin{flex:1}
.hn{font-size:14px;font-weight:500}
.hs{font-size:11px;color:var(--sub);margin-top:1px}
.hck{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.hck svg{width:13px;height:13px;stroke:white;stroke-width:2.8;fill:none;opacity:0;transition:opacity .15s}
.hck.done svg{opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:12px;text-align:center}
.sn{font-size:24px;font-weight:700}
.sl{font-size:11px;color:var(--sub);margin-top:2px}
.wgw{overflow-x:auto}
.wgt{width:100%;border-collapse:collapse;min-width:300px}
.wgt th{font-size:11px;color:var(--sub);font-weight:500;padding:8px 3px;text-align:center;border-bottom:1px solid var(--bd);background:var(--sur);white-space:nowrap}
.wgt th.tc2{color:var(--ac)}
.wgt td{padding:2px;border-bottom:1px solid #F3F0EB;vertical-align:top;height:34px}
.wgt td:first-child{font-size:10px;color:var(--mu);text-align:right;padding-right:5px;background:var(--bg);width:34px}
.wgev{font-size:9px;padding:2px 3px;border-left:2px solid;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnav{display:flex;align-items:center;gap:10px;padding:10px 0}
.cnav button{width:32px;height:32px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);font-size:18px;cursor:pointer}
.ctitle{flex:1;font-size:16px;font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.chdr{text-align:center;font-size:11px;color:var(--sub);font-weight:500;padding:5px 0}
.ccell{background:var(--sur);border-radius:6px;padding:4px 3px;min-height:56px;border:1px solid transparent;cursor:pointer;transition:border-color .15s}
.ccell:active{border-color:var(--ac)}
.ccell.om{opacity:.3;background:transparent;cursor:default}
.ccell.td{border-color:var(--ac)}
.ccell.sel{border-color:var(--ac);background:#EBF3F8}
.cdt{font-size:12px;font-weight:500;text-align:center;margin-bottom:2px}
.ccell.td .cdt{color:var(--ac);font-weight:700}
.cdots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.cdot{width:5px;height:5px;border-radius:50%}
.ctc{font-size:9px;color:var(--sub);text-align:center;margin-top:1px}
.set-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd)}
.set-row:last-child{border-bottom:none}
.sri{flex:1;min-width:0}
.sri input{font-size:13px;border:none;background:transparent;width:100%;outline:none;color:var(--tx)}
.srs{font-size:11px;color:var(--sub)}
.srs input{border:none;background:transparent;font-size:13px;outline:none;width:28px;display:inline}
.cpick{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;overflow:hidden}
.delbtn{width:26px;height:26px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:13px;color:#DC2626;flex-shrink:0}
.af{padding:12px 14px;border-top:1px solid var(--bd);display:flex;gap:6px}
.af input{padding:8px 10px;border-radius:8px;border:1px solid var(--bd);font-size:13px;background:var(--bg);outline:none;flex:1}
.af input:focus{border-color:var(--ac)}
.eji{width:38px;text-align:center;flex-shrink:0;flex:none}
.abtn{padding:8px 14px;border-radius:8px;background:var(--ac);color:white;border:none;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1A2030;color:white;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
.trow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd)}
.trow:last-child{border-bottom:none}
.trow.dt .tlb{text-decoration:line-through;color:var(--mu)}
.tlb{flex:1;font-size:14px}
.tck{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.tck.done{background:#10B981;border-color:#10B981}
.tck svg{width:11px;height:11px;stroke:white;stroke-width:2.8;fill:none;opacity:0}
.tck.done svg{opacity:1}
.tdl{width:22px;height:22px;border-radius:50%;background:#FEE2E2;border:none;cursor:pointer;font-size:12px;color:#DC2626;flex-shrink:0}
.empty{padding:20px;text-align:center;color:var(--mu);font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--sur);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h3{font-size:16px;font-weight:700;margin-bottom:4px}
.modal p{font-size:12px;color:var(--sub);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sch-edit-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.sch-edit-row:last-child{border-bottom:none}
.sch-edit-row input[type=text]{flex:1;padding:4px 8px;border-radius:6px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)}
.sch-edit-row input[type=text]:focus{border-color:var(--ac)}
.memo-box{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg);resize:vertical;min-height:80px;font-family:inherit;line-height:1.5}
.memo-box:focus{border-color:var(--ac)}
.memo-saved{font-size:11px;color:var(--mu);margin-top:4px;transition:opacity .3s}
.sch-edit-row .delbtn{flex-shrink:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    </div>
    <div class="ht">
      <h1>Yuka's Planner</h1>
      <p>Make my dreams come true today.</p>
    </div>
    <div class="si" id="si" style="opacity:0">
      <div class="sd"></div><span>保存済み</span>
    </div>
  </header>

  <div id="view-today" class="view active"></div>
  <div id="view-habits" class="view"></div>
  <div id="view-week" class="view"></div>
  <div id="view-month" class="view"></div>
  <div id="view-settings" class="view"></div>
  <div id="view-memo" class="view"></div>

  <nav class="nav">
    <button class="active" onclick="sw('today')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></div>今日
    </button>
    <button onclick="sw('habits')">
      <div class="ni"><svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>習慣
    </button>
    <button onclick="sw('week')">
      <div class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>週間
    </button>
    <button onclick="sw('month')">
      <div class="ni"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="10" x2="9" y2="21"/></svg></div>月間
    </button>
    <button onclick="sw('memo')">
      <div class="ni"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg></div>メモ
    </button>
    <button onclick="sw('settings')">
      <div class="ni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>設定
    </button>
  </nav>
</div>
<div class="toast" id="toast"></div>
<div id="modal-wrap"></div>

<script>
const DJ=['日','月','火','水','木','金','土'];
const MJ=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const DFJ=['日曜日','月曜日','火曜日','水曜日','木曜日','金曜日','土曜日'];

let habits=JSON.parse(localStorage.getItem('yp_h')||'null')||[
  {id:'yoga',name:'朝ヨガ 45分',icon:'🧘',color:'#5A8A6A'},
  {id:'med_am',name:'朝瞑想 30分',icon:'🌙',color:'#2D6A8F'},
  {id:'english',name:'英語勉強 1時間',icon:'📖',color:'#E8856A'},
  {id:'study',name:'哲学文献読み',icon:'📚',color:'#3A5FA0'},
  {id:'med_pm',name:'夜瞑想 30分',icon:'✨',color:'#7A4FA0'},
  {id:'journal',name:'日記',icon:'✏️',color:'#888'},
];

let schedule=JSON.parse(localStorage.getItem('yp_sch')||'null')||[
  {id:'s1',start:7,end:7.75,label:'朝ヨガ 45分',color:'#5A8A6A',bg:'#E8F4EC',days:[0,1,2,3,4,5,6]},
  {id:'s2',start:7.75,end:8.25,label:'朝瞑想 30分',color:'#2D6A8F',bg:'#EBF3F8',days:[0,1,2,3,4,5,6]},
  {id:'s3',start:8.25,end:9,label:'朝食・準備',color:'#C4882A',bg:'#FFF8F0',days:[0,1,2,3,4,5,6]},
  {id:'s4',start:9,end:10,label:'英語勉強',color:'#E8856A',bg:'#FFF3ED',days:[0,1,2,3,4,5,6]},
  {id:'s5',start:10,end:13,label:'GA仕事',color:'#9B6AD4',bg:'#F5F0FF',days:[1,2,3,4,5]},
  {id:'s12',start:10.5,end:11.33,label:'PHIL 111 TA（BUSAD A101）',color:'#1A2E3A',bg:'#EEF2F5',days:[1]},
  {id:'s13',start:11,end:12,label:'ELI 111（Moore Hall 551）',color:'#E8856A',bg:'#FFF3ED',days:[1,3]},
  {id:'s7',start:15,end:17.5,label:'PHIL 414B（ギリシャ哲学）',color:'#6A3A8F',bg:'#F5F0FF',days:[2]},
  {id:'s8',start:15.5,end:18,label:'PHIL 770（荘子）',color:'#2D6A8F',bg:'#EBF3F8',days:[3]},
  {id:'s6',start:13.5,end:16,label:'PHIL 725（プロセミナー）',color:'#1A2E3A',bg:'#EEF2F5',days:[4]},
  {id:'s14',start:14,end:15,label:'🖨️ コピー作業（水曜日HW）',color:'#888',bg:'#F5F5F5',days:[2]},
  {id:'s15',start:13,end:13.5,label:'🖨️ コピー作業（金・月HW）',color:'#888',bg:'#F5F5F5',days:[4]},
  {id:'s9',start:18,end:21,label:'哲学文献・課題',color:'#3A5FA0',bg:'#F0F4FF',days:[0,1,2,3,4,5,6]},
  {id:'s10',start:21,end:21.5,label:'夜瞑想 30分',color:'#7A4FA0',bg:'#F0EBF8',days:[0,1,2,3,4,5,6]},
  {id:'s11',start:21.5,end:22.5,label:'シャワー・日記',color:'#888',bg:'#FAFAFA',days:[0,1,2,3,4,5,6]},
];

// 毎週繰り返すタスク定義 (dow: 0=日,1=月,2=火,3=水,4=木,5=金,6=土)
const weeklyTasks=[
  {dow:2,label:'📝 PHIL 770 リフレクション提出（深夜締め切り）'},
  {dow:0,label:'🍱 作り置き料理'},
];

function addWeeklyTasks(){
  const n=new Date(),dow=n.getDay();
  const monday=new Date(n);
  monday.setDate(n.getDate()-(dow===0?6:dow-1));
  [-7,0,7].forEach(offset=>{
    weeklyTasks.forEach(wt=>{
      const target=new Date(monday);
      target.setDate(monday.getDate()+offset+wt.dow);
      const k=dk(target);
      if(!tasks[k])tasks[k]=[];
      const exists=tasks[k].some(t=>t.weekly&&t.label===wt.label);
      if(!exists){
        tasks[k].push({id:'w'+Date.now()+Math.random(),label:wt.label,done:false,weekly:true});
      }
    });
  });
  save();
}

let data=JSON.parse(localStorage.getItem('yp_d')||'{}');
let tasks=JSON.parse(localStorage.getItem('yp_t')||'{}');
let dayOff=0,monOff=0,tab='today',selDate=null;
let saveTimer=null;

function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    localStorage.setItem('yp_h',JSON.stringify(habits));
    localStorage.setItem('yp_sch',JSON.stringify(schedule));
    localStorage.setItem('yp_d',JSON.stringify(data));
    localStorage.setItem('yp_t',JSON.stringify(tasks));
    const el=document.getElementById('si');
    el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000);
  },500);
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function dk(d){return d.toISOString().slice(0,10)}
function getD(o){const d=new Date();d.setDate(d.getDate()+o);return d}
function getWk(){
  const n=new Date(),dow=n.getDay(),m=new Date(n);
  m.setDate(n.getDate()-(dow===0?6:dow-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});
}
function streak(hid){
  let s=0;const n=new Date();
  for(let i=0;i<365;i++){const d=new Date(n);d.setDate(n.getDate()-i);const k=dk(d);if(data[k]&&data[k][hid])s++;else if(i>0)break;}
  return s;
}

function sw(t){
  tab=t;
  document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['today','habits','week','month','memo','settings'][i]===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+t).classList.add('active');
  render();
}

function toggleH(hid,key){
  if(!data[key])data[key]={};
  data[key][hid]=!data[key][hid];
  save();toast(data[key][hid]?'✅ チェック完了！':'チェックを外しました');render();
}

function addTask(key){
  const inp=document.getElementById('ti-'+key);
  if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  if(!tasks[key])tasks[key]=[];
  tasks[key].push({id:'t'+Date.now(),label:v,done:false});
  inp.value='';save();toast('タスクを追加しました！');render();
}

function toggleT(key,tid){
  if(!tasks[key])return;
  const t=tasks[key].find(x=>x.id===tid);
  if(t){t.done=!t.done;save();render();}
}

function delT(key,tid){
  if(!tasks[key])return;
  tasks[key]=tasks[key].filter(x=>x.id!==tid);
  save();render();
}

function tkEnter(e,key){if(e.key==='Enter')addTask(key);}

function openDayModal(key){
  selDate=key;
  const d=new Date(key);
  const dayTasks=tasks[key]||[];
  let taskHtml='';
  if(dayTasks.length===0){
    taskHtml='<div class="empty">タスクはまだありません</div>';
  } else {
    dayTasks.sort((a,b)=>{
      if(!a.startTime&&!b.startTime)return 0;
      if(!a.startTime)return 1;
      if(!b.startTime)return -1;
      return a.startTime.localeCompare(b.startTime);
    });
    dayTasks.forEach(t=>{
      const timeStr=t.startTime?(t.endTime?`${t.startTime}〜${t.endTime} `:`${t.startTime} `):'';
      taskHtml+=`<div class="trow${t.done?' dt':''}">
        <button class="tck${t.done?' done':''}" onclick="toggleT('${key}','${t.id}');refreshModal('${key}')">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <span class="tlb"><span style="font-size:11px;color:var(--sub)">${timeStr}</span>${t.label}</span>
        <button class="tdl" onclick="delT('${key}','${t.id}');refreshModal('${key}')">×</button>
      </div>`;
    });
  }
  const wrap=document.getElementById('modal-wrap');
  wrap.innerHTML=`<div class="modal-bg" onclick="closeModal(event)">
    <div class="modal" style="position:relative">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h3>${d.getMonth()+1}月${d.getDate()}日 ${DJ[d.getDay()]}曜日</h3>
      <p>タスクを追加・管理できます</p>
      <div class="card" id="modal-tasks">${taskHtml}</div>
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input id="modal-start" type="time" placeholder="開始時間" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)">
        <span style="align-self:center;color:var(--mu);font-size:12px">〜</span>
        <input id="modal-end" type="time" placeholder="終了時間" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--bg)">
      </div>
      <div style="display:flex;gap:8px">
        <input id="modal-inp" placeholder="タスク・予定を追加..." style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);font-size:14px;outline:none;background:var(--bg)" onkeydown="if(event.key==='Enter')addModalTask('${key}')">
        <button class="abtn" onclick="addModalTask('${key}')">追加</button>
      </div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('modal-inp')&&document.getElementById('modal-inp').focus(),100);
}

function addModalTask(key){
  const inp=document.getElementById('modal-inp');
  if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  const startTime=document.getElementById('modal-start')?.value||'';
  const endTime=document.getElementById('modal-end')?.value||'';
  if(!tasks[key])tasks[key]=[];
  tasks[key].push({id:'t'+Date.now(),label:v,done:false,startTime,endTime});
  inp.value='';
  if(document.getElementById('modal-start'))document.getElementById('modal-start').value='';
  if(document.getElementById('modal-end'))document.getElementById('modal-end').value='';
  save();
  refreshModal(key);
  render();
}

function refreshModal(key){
  const d=new Date(key);
  const dayTasks=tasks[key]||[];
  let html='';
  if(dayTasks.length===0){
    html='<div class="empty">タスクはまだありません</div>';
  } else {
    [...dayTasks].sort((a,b)=>{
      if(!a.startTime&&!b.startTime)return 0;
      if(!a.startTime)return 1;
      if(!b.startTime)return -1;
      return a.startTime.localeCompare(b.startTime);
    }).forEach(t=>{
      const timeStr=t.startTime?(t.endTime?`${t.startTime}〜${t.endTime} `:`${t.startTime} `):'';
      html+=`<div class="trow${t.done?' dt':''}">
        <button class="tck${t.done?' done':''}" onclick="toggleT('${key}','${t.id}');refreshModal('${key}')">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <span class="tlb"><span style="font-size:11px;color:var(--sub)">${timeStr}</span>${t.label}</span>
        <button class="tdl" onclick="delT('${key}','${t.id}');refreshModal('${key}')">×</button>
      </div>`;
    });
  }
  const el=document.getElementById('modal-tasks');
  if(el)el.innerHTML=html;
}

function closeModal(e){
  if(e&&e.target!==e.currentTarget)return;
  document.getElementById('modal-wrap').innerHTML='';
  render();
}

function render(){
  if(tab==='today')renderToday();
  else if(tab==='habits')renderHabits();
  else if(tab==='week')renderWeek();
  else if(tab==='month')renderMonth();
  else if(tab==='memo')renderMemo();
  else renderSettings();
}

    {id:'copy',title:'🖨️ コピー作業まとめ',content:`【火曜日午後】水曜日のHW × 85枚
【木曜日午前】金曜日のHW × 85枚
【木曜日午前】月曜日のHW × 85枚

📦 ボックスへの配布
・石田先生: 27枚
・Andrew: 32枚

    {id:'ssn',title:'📋 SSN申請メモ',content:`日時: 9月2日（水）1:30pm
場所: 300 Ala Moana Blvd, Room 1-114

持参するもの:
・パスポート
・I-20

function saveMemo(id,val){
  const memos=JSON.parse(localStorage.getItem('yp_memos')||'{}');
  memos[id]=val;
  localStorage.setItem('yp_memos',JSON.stringify(memos));
  const el=document.getElementById('memo-saved-'+id);
  if(el){el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000);}
}

function renderToday(){
  const d=getD(dayOff),dow=d.getDay(),key=dk(d),today=dk(new Date()),isT=key===today;
  const dayTasks=tasks[key]||[];
  const doneT=dayTasks.filter(t=>t.done).length;
  let h=`<div class="dnav">
    <button onclick="dayOff--;render()">‹</button>
    <div class="dtitle">${isT?'今日':DFJ[dow]}<span class="dsub"> — ${d.getMonth()+1}月${d.getDate()}日</span></div>
    <button onclick="dayOff++;render()">›</button>
  </div>
  <div class="sec"><span>タスク${dayTasks.length>0?` (${doneT}/${dayTasks.length})`:''}</span></div>
  <div class="card">`;
  if(dayTasks.length===0)h+='<div class="empty">今日のタスクはまだありません</div>';
  else [...dayTasks].sort((a,b)=>{
    if(!a.startTime&&!b.startTime)return 0;
    if(!a.startTime)return 1;
    if(!b.startTime)return -1;
    return a.startTime.localeCompare(b.startTime);
  }).forEach(t=>{
    const timeStr=t.startTime?(t.endTime?`${t.startTime}〜${t.endTime} `:`${t.startTime} `):'';
    h+=`<div class="trow${t.done?' dt':''}">
      <button class="tck${t.done?' done':''}" onclick="toggleT('${key}','${t.id}')" aria-label="${t.label}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <span class="tlb"><span style="font-size:11px;color:var(--sub)">${timeStr}</span>${t.label}</span>
      <button class="tdl" onclick="delT('${key}','${t.id}')">×</button>
    </div>`;
  });
  h+=`<div class="af">
    <input id="ti-${key}" placeholder="タスクを追加..." onkeydown="tkEnter(event,'${key}')">
    <button class="abtn" onclick="addTask('${key}')">追加</button>
  </div></div>
  <div class="sec"><span>スケジュール</span><span class="sec-edit" onclick="openSchEdit()">編集</span></div>
  <div class="card">`;
  for(let hr=6;hr<=22;hr++){
    for(let half=0;half<2;half++){
      const t=hr+(half*0.5);
      const slotEnd=t+0.5;
      const evs=schedule.filter(e=>e.days.includes(dow)&&e.start<slotEnd&&e.end>t);
      const label=half===0?`${hr}:00`:`${hr}:30`;
      const isHourBorder=half===0&&hr>6;
      h+=`<div class="tlr"><div class="tt">${half===0?hr+':00':''}</div><div class="tc${isHourBorder?' hb':''}">`;
      evs.forEach(e=>{
        const isStart=e.start>=t&&e.start<slotEnd;
        if(isStart){
          h+=`<div class="ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color}"><span style="font-size:10px;opacity:.7">${timeToStr(e.start)}〜${timeToStr(e.end)}</span> ${e.label}</div>`;
        } else {
          h+=`<div class="ev" style="background:${e.bg};border-left-color:${e.color};color:${e.color};opacity:.6">↳ ${e.label}</div>`;
        }
      });
      h+='</div></div>';
    }
  }
  h+=`</div><div class="sec"><span>今日の習慣</span><span class="sec-edit" onclick="sw('settings')">編集</span></div><div class="card">`;
  habits.forEach(hb=>{
    const done=!!(data[key]&&data[key][hb.id]),s=streak(hb.id);
    h+=`<div class="hrow">
      <div class="hic" style="background:${hb.color}22">${hb.icon}</div>
      <div class="hin"><div class="hn">${hb.name}</div><div class="hs">${s>0?`🔥 ${s}日連続`:'今日からスタート'}</div></div>
      <button class="hck${done?' done':''}" style="${done?`background:${hb.color};border-color:${hb.color}`:''}" onclick="toggleH('${hb.id}','${key}')" aria-label="${hb.name}">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>`;
  });
  h+='</div>';
  document.getElementById('view-today').innerHTML=h;
}

function timeToStr(t){
  const h=Math.floor(t),m=Math.round((t%1)*60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function strToTime(s){
  const [h,m]=s.split(':').map(Number);
  return h+(m/60);
}

function openSchEdit(){
  const wrap=document.getElementById('modal-wrap');
  const dayLabels=['日','月','火','水','木','金','土'];
  let rows='';
  schedule.forEach((s,i)=>{
    const dayChecks=dayLabels.map((d,di)=>
      `<label style="display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--sub);cursor:pointer">
        <input type="checkbox" ${s.days.includes(di)?'checked':''} onchange="schToggleDay(${i},${di},this.checked)" style="width:14px;height:14px;accent-color:var(--ac)">
        ${d}
      </label>`
    ).join('');
    rows+=`<div style="background:var(--bg);border-radius:8px;padding:10px;margin-bottom:8px;border:1px solid var(--bd)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <input type="text" value="${s.label}" onchange="schedule[${i}].label=this.value;save()" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--sur)">
        <input type="color" class="cpick" value="${s.color}" oninput="schedule[${i}].color=this.value;schedule[${i}].bg=this.value+'22';save()" style="background:${s.color}">
        <button class="delbtn" onclick="schedule.splice(${i},1);save();openSchEdit()">×</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:11px;color:var(--sub);flex-shrink:0">開始</span>
        <input type="time" value="${timeToStr(s.start)}" onchange="schedule[${i}].start=strToTime(this.value);save()" style="flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--sur)">
        <span style="font-size:11px;color:var(--sub);flex-shrink:0">終了</span>
        <input type="time" value="${timeToStr(s.end)}" onchange="schedule[${i}].end=strToTime(this.value);save()" style="flex:1;padding:5px 8px;border-radius:6px;border:1px solid var(--bd);font-size:13px;outline:none;background:var(--sur)">
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${dayChecks}</div>
    </div>`;
  });
  wrap.innerHTML=`<div class="modal-bg" onclick="closeModal(event)">
    <div class="modal" style="position:relative;max-height:85vh;overflow-y:auto">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h3>スケジュール編集</h3>
      <p>時間・曜日・ラベル・色を編集できます</p>
      <div style="margin-bottom:12px">${rows}</div>
      <button class="abtn" style="width:100%;padding:12px" onclick="addSchItem()">＋ 新しいスケジュールを追加</button>
    </div>
  </div>`;
}

function schToggleDay(si,di,checked){
  if(checked){if(!schedule[si].days.includes(di))schedule[si].days.push(di);schedule[si].days.sort();}
  else schedule[si].days=schedule[si].days.filter(d=>d!==di);
  save();
}

function addSchItem(){
  schedule.push({id:'s'+Date.now(),start:9,end:10,label:'新しい予定',color:'#2D6A8F',bg:'#EBF3F8',days:[1,2,3,4,5]});
  save();openSchEdit();
}

function renderHabits(){
  const dates=getWk(),today=dk(new Date());
  let total=0,possible=dates.length*habits.length;
  dates.forEach(d=>{const k=dk(d);habits.forEach(h=>{if(data[k]&&data[k][h.id])total++;})});
  const pct=possible>0?Math.round(total/possible*100):0;
  const maxS=Math.max(0,...habits.map(h=>streak(h.id)));
  let h=`<div style="padding-top:8px"></div><div class="stats">
    <div class="stat"><div class="sn">${pct}%</div><div class="sl">今週の達成率</div></div>
    <div class="stat"><div class="sn">${total}</div><div class="sl">今週のチェック</div></div>
    <div class="stat"><div class="sn">${maxS}日</div><div class="sl">最長連続</div></div>
  </div><div class="sec">今週の習慣</div><div class="card"><div class="wgw">
  <table class="wgt"><thead><tr><th></th>`;
  dates.forEach(d=>{const k=dk(d),isT=k===today;h+=`<th class="${isT?'tc2':''}">${DJ[d.getDay()]}<br>${d.getDate()}</th>`;});
  h+='</tr></thead><tbody>';
  habits.forEach(hb=>{
    h+=`<tr><td style="text-align:left;padding:10px;font-size:12px;border-bottom:1px solid #F3F0EB">${hb.icon} ${hb.name}</td>`;
    dates.forEach(d=>{
      const k=dk(d),done=!!(data[k]&&data[k][hb.id]);
      h+=`<td style="text-align:center;border-bottom:1px solid #F3F0EB">
        <button class="hck${done?' done':''}" style="${done?`background:${hb.color};border-color:${hb.color}`:''}" onclick="toggleH('${hb.id}','${k}')" aria-label="${hb.name}">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        </button></td>`;
    });
    h+='</tr>';
  });
  h+='</tbody></table></div></div>';
  document.getElementById('view-habits').innerHTML=h;
}

function renderWeek(){
  const dates=getWk(),today=dk(new Date());
  let h=`<div style="padding-top:8px"></div>
  <div class="sec"><span>週間スケジュール</span><span class="sec-edit" onclick="openSchEdit()">スケジュール編集</span></div>
  <p style="font-size:11px;color:var(--mu);margin-bottom:8px">曜日の列をタップしてタスクを追加</p>
  <div class="card"><div class="wgw"><table class="wgt"><thead><tr><th></th>`;
  dates.forEach(d=>{
    const k=dk(d),isT=k===today;
    h+=`<th class="${isT?'tc2':''}" onclick="openDayModal('${k}')" style="cursor:pointer">${DJ[d.getDay()]}<br>${d.getDate()}</th>`;
  });
  h+='</tr></thead><tbody>';
  for(let hr=7;hr<=22;hr++){
    for(let half=0;half<2;half++){
      const t=hr+(half*0.5);
      const slotEnd=t+0.5;
      h+=`<tr><td style="font-size:10px;color:var(--mu);text-align:right;padding-right:5px;background:var(--bg);width:34px">${half===0?hr+':00':hr+':30'}</td>`;
      dates.forEach(d=>{
        const dow=d.getDay(),k=dk(d);
        const evs=schedule.filter(e=>e.days.includes(dow)&&e.start<slotEnd&&e.end>t);
        const dayT=(tasks[k]||[]).filter(t=>!t.done);
        h+=`<td onclick="openDayModal('${k}')" style="cursor:pointer;padding:2px;border-bottom:1px solid #F3F0EB;vertical-align:top;height:28px">`;
        evs.forEach(e=>{
          const isStart=e.start>=t&&e.start<slotEnd;
          if(isStart){
            h+=`<div class="wgev" style="background:${e.bg};border-left-color:${e.color};color:${e.color}">${timeToStr(e.start)} ${e.label}</div>`;
          } else {
            h+=`<div class="wgev" style="background:${e.bg};border-left-color:${e.color};color:${e.color};opacity:.5">↳</div>`;
          }
        });
        const noTimeTasks=(tasks[k]||[]).filter(t=>!t.done&&!t.startTime);
        const timedTasks=(tasks[k]||[]).filter(t=>!t.done&&t.startTime);
        if(t===7&&noTimeTasks.length>0){
          noTimeTasks.forEach(t=>h+=`<div class="wgev" style="background:#F0FDF4;border-left-color:#10B981;color:#065F46">📝 ${t.label}</div>`);
        }
        timedTasks.forEach(tk=>{
          const tStart=strToTime(tk.startTime);
          if(tStart>=t&&tStart<slotEnd){
            const timeStr=tk.endTime?`${tk.startTime}〜${tk.endTime}`:`${tk.startTime}`;
            h+=`<div class="wgev" style="background:#F0FDF4;border-left-color:#10B981;color:#065F46">📝 ${timeStr} ${tk.label}</div>`;
          }
        });
        h+='</td>';
      });
      h+='</tr>';
    }
  }
  h+='</tbody></table></div></div>';
  document.getElementById('view-week').innerHTML=h;
}

function renderMonth(){
  const n=new Date(),yr=n.getFullYear(),mo=n.getMonth()+monOff;
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0),today=dk(new Date());
  let h=`<div class="cnav">
    <button onclick="monOff--;render()">‹</button>
    <div class="ctitle">${yr}年 ${MJ[((mo%12)+12)%12]}</div>
    <button onclick="monOff++;render()">›</button>
  </div><p style="font-size:11px;color:var(--mu);margin-bottom:8px">日付をタップしてタスクを追加</p>
  <div class="cgrid">`;
  DJ.forEach(d=>h+=`<div class="chdr">${d}</div>`);
  const startDow=first.getDay();
  for(let i=0;i<startDow;i++){const d=new Date(first);d.setDate(d.getDate()-(startDow-i));h+=`<div class="ccell om"><div class="cdt">${d.getDate()}</div></div>`;}
  for(let day=1;day<=last.getDate();day++){
    const d=new Date(yr,mo<0?mo+12:mo,day),k=dk(d),isT=k===today;
    const doneH=habits.filter(hb=>(data[k]||{})[hb.id]);
    const dayT=tasks[k]||[];
    const pendT=dayT.filter(t=>!t.done).length;
    const doneT=dayT.filter(t=>t.done).length;
    h+=`<div class="ccell${isT?' td':''}" onclick="openDayModal('${k}')">
      <div class="cdt">${day}</div>
      <div class="cdots">${doneH.slice(0,5).map(hb=>`<div class="cdot" style="background:${hb.color}"></div>`).join('')}</div>`;
    if(dayT.length>0)h+=`<div class="ctc">${doneT>0?`✅${doneT}`:''} ${pendT>0?`📝${pendT}`:''}</div>`;
    h+='</div>';
  }
  const rem=(7-((startDow+last.getDate())%7))%7;
  for(let i=1;i<=rem;i++)h+=`<div class="ccell om"><div class="cdt">${i}</div></div>`;
  h+='</div>';
  document.getElementById('view-month').innerHTML=h;
}

function renderSettings(){
  let h='<div style="padding-top:8px"></div><div class="sec">習慣をカスタマイズ</div><div class="card">';
  habits.forEach((hb,i)=>{
    h+=`<div class="set-row">
      <div class="hic" style="background:${hb.color}22">${hb.icon}</div>
      <div class="sri">
        <input value="${hb.name}" onchange="habits[${i}].name=this.value;save()" placeholder="習慣名">
        <div class="srs">アイコン: <input value="${hb.icon}" onchange="habits[${i}].icon=this.value;save();render()" style="width:28px"></div>
      </div>
      <input type="color" class="cpick" value="${hb.color}" oninput="habits[${i}].color=this.value;save();render()" style="background:${hb.color}">
      <button class="delbtn" onclick="if(confirm('削除しますか？')){habits.splice(${i},1);save();render()}">×</button>
    </div>`;
  });
  h+=`<div class="af">
    <input id="ni" placeholder="🌟" style="width:38px;text-align:center;flex:none" maxlength="2">
    <input id="nn" placeholder="新しい習慣を追加">
    <button class="abtn" onclick="addH()">追加</button>
  </div></div>
  <div class="sec">スケジュール編集</div>
  <div class="card">`;
  schedule.forEach((s,i)=>{
    h+=`<div class="sch-edit-row">
      <input type="text" value="${s.label}" onchange="schedule[${i}].label=this.value;save()">
      <input type="color" class="cpick" value="${s.color}" oninput="schedule[${i}].color=this.value;schedule[${i}].bg=this.value+'22';save()" style="background:${s.color}">
      <button class="delbtn" onclick="schedule.splice(${i},1);save();render()">×</button>
    </div>`;
  });
  h+='</div>';
  document.getElementById('view-settings').innerHTML=h;
}

function addH(){
  const icon=document.getElementById('ni').value.trim()||'⭐';
  const name=document.getElementById('nn').value.trim();
  if(!name)return;
  habits.push({id:'h'+Date.now(),name,icon,color:'#888'});
  save();toast('習慣を追加しました！');render();
}

addWeeklyTasks();
render();
